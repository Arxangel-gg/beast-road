[preset.1.options]

custom_template/debug=""
custom_template/release=""

# Off, and it is not a performance choice. A threaded web build needs the page
# served with COOP/COEP cross-origin-isolation headers, and GitHub Pages does
# not let you set response headers at all - the game would load and then fail to
# start SharedArrayBuffer, with nowhere to fix it. The project already runs
# gl_compatibility and owns no Thread, so single-threaded costs it nothing.
variant/thread_support=false
variant/extensions_support=false

# The art is 2D pixel art imported lossless; there is no VRAM-compressed texture
# for either of these to pick a format for.
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false

html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false

progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
