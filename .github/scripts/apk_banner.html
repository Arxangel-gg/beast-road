<!-- The "Download for Android" offer on the browser build. release.yml puts it
     before </body> of Godot's exported shell and fills __APK_URL__.

     It can be closed, and a close is remembered for this site in the player's
     own browser, because on a phone it sits over the game's own bottom-right
     buttons (owner, 2026-09-27). Storage is wrapped: a private window or
     blocked site data throws on access, and the banner must still close. -->
<div id="br-apk" style="position:fixed;right:14px;bottom:14px;z-index:99;display:flex;align-items:center;gap:0;font:600 14px/1 system-ui,sans-serif;background:rgba(24,26,32,.88);border:1px solid #6c5a3a;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.45)">
  <a id="br-apk-link" href="__APK_URL__" rel="noopener" style="color:#f2e6cd;text-decoration:none;padding:11px 6px 11px 15px">Download for Android</a>
  <button id="br-apk-close" type="button" aria-label="Close" title="Close" style="all:unset;cursor:pointer;color:#c9b894;font:600 20px/1 system-ui,sans-serif;padding:6px 12px 8px 10px;margin-left:4px;border-left:1px solid #4a3f2c">&times;</button>
</div>
<script>
(function () {
  var key = "wilderhold.apk_banner_closed";
  var banner = document.getElementById("br-apk");
  if (!banner) { return; }
  try {
    if (window.localStorage && localStorage.getItem(key) === "1") {
      banner.remove();
      return;
    }
  } catch (e) {}
  document.getElementById("br-apk-close").addEventListener("click", function (event) {
    event.preventDefault();
    event.stopPropagation();
    banner.remove();
    try { localStorage.setItem(key, "1"); } catch (e) {}
  });
})();
</script>
