name: Release

# Publishing a build is pushing a tag. Nothing else needs to happen locally —
# in particular, nobody needs Godot's export templates on their own machine.
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# Run it by hand from the Actions tab to rehearse a build without tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.4.0). Leave blank to build only.'
        required: false
        default: ''

permissions:
  contents: write
  # For publishing the browser build to GitHub Pages. `pages` writes the site,
  # `id-token` is what deploy-pages uses to prove the deployment came from this
  # workflow rather than from somebody who guessed a URL.
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.7.1
  # Must match the preset name inside both export_presets.cfg files.
  EXPORT_PRESET: Windows Desktop
  # The game project only. The launcher is a desktop installer and has no
  # meaning in a browser.
  WEB_PRESET: Web

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Validate Update Manager release contract
        shell: pwsh
        run: ./tools/publish_contract_test.ps1

      - name: Import assets
        # Godot must import once before it can export; a cold checkout has no
        # .godot/ directory. The editor exits non-zero on some headless
        # shutdowns, which is not an import failure.
        run: |
          godot --headless --path game --import || true
          godot --headless --path launcher --import || true

      - name: Register gameplay resource classes
        # New class_name Resource types must be present in the cold checkout's
        # global class cache before autoloads can type-check against them. A
        # short editor boot is the deterministic registration pass; --import
        # alone may exit before that cache is written on a fresh runner.
        run: godot --headless --editor --path game --quit

      - name: Validate the projects and updater contract
        run: |
          set -euo pipefail
          run_godot_clean() {
            local log status
            log="$(mktemp)"
            set +e
            godot "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ] || grep -Eq '^(SCRIPT )?ERROR:|^WARNING:' "$log"; then
              echo "::group::Output of: godot $*"
              cat "$log"
              echo "::endgroup::"
              detail=$(grep -E '^(SCRIPT )?ERROR:|^WARNING:' "$log" | head -n 8 | tr '\n' '~')
              if [ -z "$detail" ]; then detail="exited $status with no error line"; fi
              echo "::error title=Godot validation::[$*] ${detail}"
              return 1
            fi
          }

          run_godot_clean --headless --path game --quit
          run_godot_clean --headless --path game res://tools/audio_verify.tscn
          run_godot_clean --headless --path game --script res://tools/run_tool.gd -- report
          run_godot_clean --headless --path game res://tools/loot_art_check.tscn
          run_godot_clean --headless --path game res://tools/blood_vfx_check.tscn
          run_godot_clean --headless --path game res://tools/recovery_polish_check.tscn
          run_godot_clean --headless --path game res://tools/coop_lobby_check.tscn
          # Anything meaning "a person is standing here" must see all four of
          # them. Both hero groups answer correctly with one player, so this is
          # the class of bug a solo test cannot possibly find.
          run_godot_clean --headless --path game res://tools/party_reach_check.tscn
          # An upgrade that is invisible is an upgrade nobody feels they bought.
          # The scaling existed and did nothing for years because the tier was
          # assigned after the shot had already been built.
          run_godot_clean --headless --path game res://tools/projectile_tier_check.tscn
          run_godot_clean --headless --path game res://tools/wildlife_spawn_check.tscn
          run_godot_clean --headless --path game res://tools/ranged_check.tscn
          run_godot_clean --headless --path game res://tools/elite_check.tscn
          run_godot_clean --headless --path game res://tools/codex_check.tscn
          run_godot_clean --headless --path game res://tools/weapon_vfx_check.tscn
          run_godot_clean --headless --path game res://tools/crossroad_vote_check.tscn
          run_godot_clean --headless --path game res://tools/save_guard_check.tscn
          run_godot_clean --headless --path game res://tools/extension_platform_check.tscn
          run_godot_clean --headless --path game res://tools/reanchor_check.tscn
          run_godot_clean --headless --path game res://tools/discipline_check.tscn
          run_godot_clean --headless --path game res://tools/raid_suspend_check.tscn
          run_godot_clean --headless --path game res://tools/seed_reproduction_check.tscn
          run_godot_clean --headless --path game res://tools/boot_check.tscn
          run_godot_clean --headless --path game res://tools/breather_check.tscn
          run_godot_clean --headless --path game res://tools/live_settings_check.tscn
          run_godot_clean --headless --path game res://tools/structure_check.tscn
          run_godot_clean --headless --path game res://tools/torch_check.tscn
          # Every tower and every building tier must carry its exact four-pose
          # PixelLab package. Runtime fallbacks are for damaged installs, not a
          # release excuse; this also gates canvas size and ground-anchor drift.
          run_godot_clean --headless --path game res://tools/structure_art_check.tscn
          # Shipped code must not name anything under tools/: the export strips
          # that directory, and a missing class_name is a parse failure, so the
          # script simply does not load. Source-run gates cannot see this.
          run_godot_clean --headless --path game --script res://tools/run_tool.gd -- tool-leak
          # Reporting only, never a gate: a migration in progress is supposed to
          # be incomplete. Logging it on every release gives the v4 burndown a
          # history attached to real builds rather than to memory.
          run_godot_clean --headless --path game --script res://tools/run_tool.gd -- audit
          # Also reporting only, for the same reason: the difficulty curve is a
          # judgement call, and a red build is the wrong way to hold an opinion
          # about pacing. Printing it on every release gives the curve a history
          # attached to builds people actually played.
          run_godot_clean --headless --path game res://tools/curve_report.tscn
          # The wilderness is interactive but is never a structure attacker;
          # actors, town art, foliage and local ambience also share one
          # feet-based depth layer. These are visual/behavioral regressions that
          # a three-second soak can run through without ever noticing.
          run_godot_clean --headless --path game res://tools/regression_check.tscn
          run_godot_clean --headless --path game res://tools/treeline_check.tscn
          run_godot_clean --headless --path game res://tools/balance_test.tscn
          run_godot_clean --headless --path game res://tools/menu_check.tscn
          run_godot_clean --headless --path game res://tools/chronicle_check.tscn
          run_godot_clean --headless --path game res://tools/save_backup_check.tscn
          run_godot_clean --headless --path game res://tools/leaderboard_check.tscn
          run_godot_clean --headless --path game res://tools/milestone_cinematic_check.tscn
          run_godot_clean --headless --path game res://tools/soak.tscn -- --seconds=3 --shots=100 --build
          # Long enough for waves to reach the torches. Snuffing has been silently
          # dead twice; it is not a thing to verify by looking at a screenshot.
          run_godot_clean --headless --path game res://tools/soak.tscn -- --seconds=45 --shots=999 --expect-snuff
          # GDD SS47 growth budget. Frame timing is reported but not asserted
          # here: the dummy renderer does no GPU work, so a headless frame rate
          # says nothing about a real one. Node, orphan and memory growth are
          # entirely real headless, and they are what catches a system that adds
          # something every wave and never frees it.
          run_godot_clean --headless --path game res://tools/perf_check.tscn -- --seconds=45 --build
          run_godot_clean --headless --path launcher res://tests/release_pipeline_test.tscn

      - name: Stamp the game with this tag
        # GDD SS46: the game shows its semantic version in Settings and the
        # debrief. Written in just before export and never committed, so the
        # repository copy stays "dev" and a build made on somebody's machine says
        # "development build" rather than impersonating a release.
        run: |
          set -euo pipefail
          INFO=game/scripts/systems/build_info.gd
          sed -i "s|^const VERSION: String = \"dev\"$|const VERSION: String = \"${GITHUB_REF_NAME}\"|" "$INFO"
          grep -q "const VERSION: String = \"${GITHUB_REF_NAME}\"" "$INFO" \
            || { echo "::error::Failed to stamp the game version."; exit 1; }

      - name: Export the game
        run: bash .github/scripts/export_project.sh game game ../build/game/BeastRoad.exe "$EXPORT_PRESET"

      - name: Stamp the launcher with this tag
        # A launcher can only know it is out of date by comparing what it was
        # built from against the newest release. Nothing else in the build knows
        # the tag, so it is written in here, just before the export - never
        # committed, so the repository copy stays "dev" and a locally exported
        # launcher correctly refuses to replace itself.
        run: |
          set -euo pipefail
          CONFIG=launcher/scripts/LauncherConfig.gd
          sed -i "s|^const VERSION: String = \"dev\"$|const VERSION: String = \"${GITHUB_REF_NAME}\"|" "$CONFIG"
          grep -q "const VERSION: String = \"${GITHUB_REF_NAME}\"" "$CONFIG" \
            || { echo "::error::Failed to stamp the launcher version."; exit 1; }

      - name: Publish the launcher's own version
        # This is what stops every game update from also replacing the player's
        # launcher. The launcher compares the version in this marker's filename
        # against the LAUNCHER_VERSION compiled into it; equal means the published
        # launcher is already the one running, however many game releases have
        # gone by since it last changed.
        #
        # A marker asset rather than a version in the executable's filename: the
        # permanent install link resolves by exact filename, so renaming the exe
        # would break it on the very release that fixes the update.
        #
        # Read from the same constant the launcher compares against, on purpose.
        # A second source of truth for the launcher version would eventually
        # disagree with the first, and it would disagree silently.
        run: |
          set -euo pipefail
          CONFIG=launcher/scripts/LauncherConfig.gd
          LAUNCHER_VERSION="$(sed -n 's|^const LAUNCHER_VERSION: String = "\(.*\)"$|\1|p' "$CONFIG")"
          if [ -z "$LAUNCHER_VERSION" ]; then
            echo "::error::Could not read LAUNCHER_VERSION from $CONFIG."
            exit 1
          fi
          case "$LAUNCHER_VERSION" in
            *[!0-9.]*)
              echo "::error::LAUNCHER_VERSION must be digits and dots only; the launcher will not parse anything else."
              exit 1
              ;;
          esac
          MARKER="launcher-version-${LAUNCHER_VERSION}.txt"
          {
            echo "Beast Road launcher version ${LAUNCHER_VERSION}."
            echo
            echo "The launcher reads this filename to decide whether it needs replacing."
            echo "Game-only releases carry the same launcher version and leave the"
            echo "installed launcher alone, so updating the game does not re-download it."
          } > "$MARKER"
          echo "LAUNCHER_VERSION_ASSET=$MARKER" >> "$GITHUB_ENV"
          echo "Publishing launcher version ${LAUNCHER_VERSION} as $MARKER"

      - name: Export the launcher
        run: bash .github/scripts/export_project.sh launcher launcher ../build/launcher/BeastRoadLauncher.exe "$EXPORT_PRESET"

      - name: Export the web build
        run: bash .github/scripts/export_project.sh web game ../build/web/index.html "$WEB_PRESET"

      - name: Check the exports are shippable
        run: |
          set -euo pipefail
          test -s build/game/BeastRoad.exe
          test -s build/launcher/BeastRoadLauncher.exe

          # A web export writes a set of files beside the html, and the one that
          # matters is the wasm — index.html on its own is what a half-installed
          # template produces.
          for f in index.html index.js index.wasm index.pck; do
            test -s "build/web/$f"
          done

          # A threaded build only runs on a page served with COOP/COEP
          # cross-origin-isolation headers. Netlify can send those, unlike Pages
          # — but the game is going into an iframe on a Carrd page, and a
          # cross-origin-isolated document will not embed in one that is not.
          # Single-threaded costs this project nothing: it renders through
          # gl_compatibility and owns no Thread. If this file exists,
          # variant/thread_support is back on and the page would load and then
          # fail to start.
          if [ -e build/web/index.worker.js ]; then
            echo "::error::Web build is threaded. Set variant/thread_support=false in game/export_presets.cfg."
            exit 1
          fi

          # Caching rules travel inside the bundle rather than living in a host's
          # dashboard, so a redeploy cannot lose them. Netlify reads `_headers`
          # from the root of whatever is deployed; other static hosts ignore it.
          #
          # The wasm and the pck belong to the release they were built from and
          # are tens of megabytes, so they cache for a year. index.html must not:
          # it is what points at the others, and a cached copy of it is how a
          # player ends up running last month's game against this month's data.
          {
            echo '/index.wasm'
            echo '  Cache-Control: public, max-age=31536000, immutable'
            echo '/index.pck'
            echo '  Cache-Control: public, max-age=31536000, immutable'
            echo '/index.js'
            echo '  Cache-Control: public, max-age=31536000, immutable'
            echo '/index.html'
            echo '  Cache-Control: no-cache'
          } > build/web/_headers
          test -s build/web/_headers

          # The game ships as a folder, so a sidecar .pck is expected and must
          # be present - without it the exe cannot find its data.
          test -s build/game/BeastRoad.pck

          # The launcher ships as a single file. If Godot wrote a sidecar .pck
          # then embed_pck is off, and the exe we upload would fail on the
          # user's machine with "Is the .pck file missing?". v0.1.0 shipped
          # exactly that.
          if [ -e build/launcher/BeastRoadLauncher.pck ]; then
            echo "::error::Launcher exported with a separate .pck. Set binary_format/embed_pck=true in launcher/export_presets.cfg."
            exit 1
          fi

          ls -la build/game build/launcher build/web

      - name: Package
        run: |
          set -euo pipefail
          # The launcher strips a single wrapper folder if it finds one, so
          # either shape works — this zips the contents.
          (cd build/game && zip -qr ../../BeastRoad-windows.zip .)
          cp build/launcher/BeastRoadLauncher.exe BeastRoadLauncher.exe

          # The archive is what actually reaches a player, so assert its
          # contents rather than the folder it was built from.
          unzip -l BeastRoad-windows.zip
          unzip -l BeastRoad-windows.zip | grep -q "BeastRoad.exe"
          unzip -l BeastRoad-windows.zip | grep -q "BeastRoad.pck"
          # WebRTC is what lets a desktop player and a browser player meet, and
          # on desktop it lives in a DLL rather than in the engine. Godot ships
          # it automatically from the .gdextension - and an export that quietly
          # did not would produce a build whose room button is decoration, with
          # nothing failing anywhere. Asserted on the archive that reaches a
          # player rather than on the folder it was built from.
          unzip -l BeastRoad-windows.zip | grep -q "libwebrtc_native.windows.template_release.x86_64.dll"

          # The zip *is* the deployment. Netlify takes a folder or a zip whose
          # index.html sits at its root, which is exactly this shape, so the
          # release asset is dragged straight onto a Netlify site with nothing
          # unpacked or rearranged in between.
          (cd build/web && zip -qr ../../BeastRoad-web.zip .)
          unzip -l BeastRoad-web.zip | grep -q "index.wasm"
          unzip -l BeastRoad-web.zip | grep -q "_headers"
          # And the opposite for the web build: a browser implements WebRTC
          # itself, so the desktop DLL has no business being in there. Four
          # megabytes of dead weight on a download that already asks for sixty.
          if unzip -l BeastRoad-web.zip | grep -q "libwebrtc_native"; then
            echo "::error::The web export bundled the desktop WebRTC library."
            exit 1
          fi

          ls -la BeastRoad-windows.zip BeastRoad-web.zip BeastRoadLauncher.exe "$LAUNCHER_VERSION_ASSET"

      # **The backup mirror, refreshed every release and never by hand.**
      #
      # GitHub serves release assets from a host that is filtered in some
      # countries - reported by a player whose version check worked perfectly
      # while the download sat at 0%. Dropbox is the second place to try.
      #
      # Uploaded to a *fixed path* in overwrite mode, which is the whole trick:
      # a Dropbox link belongs to the file rather than to the name, so deleting
      # and re-uploading would silently break every launcher in the world.
      # Overwriting keeps one link alive forever, and the shared link is then
      # read back and published as `mirrors.json` so the launcher learns it
      # without a new build.
      #
      # Skipped entirely, with a notice and no failure, when the secrets are
      # absent: a mirror is a convenience and a release must not depend on one.
      - name: Mirror to Dropbox
        id: dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          # Always present, even on the skip path below: `body_path` must never
          # dangle, and an empty body simply means the generated notes stand alone.
          : > release_body.md
          if [ -z "${DROPBOX_REFRESH_TOKEN:-}" ]; then
            echo "::notice title=Mirror::No Dropbox secrets set; skipping the backup mirror."
            exit 0
          fi

          # Short-lived tokens only, minted from the refresh token. A long-lived
          # token in a secret is a long-lived token in every log that ever
          # prints an environment.
          TOKEN="$(curl -sf -X POST https://api.dropbox.com/oauth2/token             -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET"             -d grant_type=refresh_token             -d "refresh_token=$DROPBOX_REFRESH_TOKEN" | jq -r .access_token)"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error title=Mirror::Could not exchange the Dropbox refresh token."
            exit 1
          fi

          DEST="/BeastRoad/BeastRoad-windows.zip"
          curl -sf -X POST https://content.dropboxapi.com/2/files/upload             -H "Authorization: Bearer $TOKEN"             -H "Dropbox-API-Arg: {\"path\":\"$DEST\",\"mode\":\"overwrite\",\"mute\":true}"             -H "Content-Type: application/octet-stream"             --data-binary @BeastRoad-windows.zip > /dev/null
          echo "Uploaded $(du -h BeastRoad-windows.zip | cut -f1) to Dropbox:$DEST"

          # Reuse the existing public link if there is one; make it if not. The
          # link must survive every future release, so it is never recreated
          # once it exists.
          LINK="$(curl -sf -X POST https://api.dropboxapi.com/2/sharing/list_shared_links             -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"             -d "{\"path\":\"$DEST\",\"direct_only\":true}" | jq -r '.links[0].url // empty')"
          if [ -z "$LINK" ]; then
            LINK="$(curl -sf -X POST https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings               -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"               -d "{\"path\":\"$DEST\",\"settings\":{\"requested_visibility\":\"public\",\"audience\":\"public\",\"access\":\"viewer\"}}"               | jq -r '.url // empty')"
          fi
          if [ -z "$LINK" ]; then
            echo "::error title=Mirror::Uploaded, but could not obtain a public link."
            exit 1
          fi

          # `dl=1` is what turns a Dropbox preview page into the file itself.
          #
          # Assembled properly rather than by appending. The first attempt did
          # `sed 's/[?&]dl=0$//; s/$/?dl=1/'` on the assumption that a share link
          # always ends in `dl=0` - modern `scl/fi` links do not, so it appended
          # a *second* `?` and produced a URL that could never work. Strip any
          # `dl=` that is there, then join with the right separator.
          # Pure shell on purpose: a heredoc inside a YAML `run:` block cannot
          # close, because bash wants the terminator at column 0 and YAML wants
          # it indented. Written the clever way first and it would not have run.
          DIRECT="${LINK%&dl=0}"
          DIRECT="${DIRECT%\?dl=0}"
          case "$DIRECT" in
            *\?*) DIRECT="$DIRECT&dl=1" ;;
            *)     DIRECT="$DIRECT?dl=1" ;;
          esac
          echo "Mirror URL: $DIRECT"

          # **Proved, not assumed.** A mirror is only ever used when the primary
          # has already failed, so a broken one is discovered by the player it
          # was meant to rescue. One range request costs a kilobyte and settles
          # it here instead - and it is exactly what the malformed URL above
          # would have failed.
          if ! curl -sfL -r 0-3 "$DIRECT" -o mirror_probe.bin; then
            echo "::error title=Mirror::The mirror URL did not serve anything."
            exit 1
          fi
          if [ "$(head -c 2 mirror_probe.bin)" != "PK" ]; then
            echo "::error title=Mirror::The mirror URL served something that is not a zip."
            exit 1
          fi
          rm -f mirror_probe.bin
          echo "Mirror verified: serves a zip."

          jq -n --arg url "$DIRECT" '[{name:"Dropbox",assets:{"BeastRoad-windows.zip":$url}}]'             > mirrors.json
          cat mirrors.json

          # **And into the release body**, which is the copy that reaches a
          # filtered player.
          #
          # The asset above is served from `release-assets.githubusercontent.com`
          # - the same host the mirror exists to route around - so a launcher
          # behind a national filter could never fetch the list telling it where
          # else to go. The body travels in the `api.github.com` response the
          # launcher already reads to learn the tag, so if it knows there is an
          # update it has this too.
          #
          # Wrapped in an HTML comment: invisible on the rendered release page,
          # present in the API payload.
          {
            printf '%s\n' '<!--beast-road-mirrors'
            cat mirrors.json
            printf '%s\n' 'beast-road-mirrors-->'
          } > release_body.md
          echo "Release body carries the mirror list."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beast-road-windows
          path: |
            BeastRoad-windows.zip
            BeastRoad-web.zip
            BeastRoadLauncher.exe
            launcher-version-*.txt
            mirrors.json

      - name: Prepare the browser build for Pages
        # Jekyll is Pages' default processor and it drops files beginning with
        # an underscore, which would silently eat `_headers`. It has nothing to
        # do here anyway: this is an exported game, not a site to render.
        run: |
          set -euo pipefail
          touch build/web/.nojekyll

          # The custom domain travels inside the artifact rather than living
          # only in the repository's Pages settings. Same reasoning as
          # `_headers`: a deployment should carry everything that decides where
          # and how it is served, so no redeploy can quietly lose it.
          echo 'beastroad.arxangel.gg' > build/web/CNAME

          test -s build/web/index.wasm

          # **The Download button, injected rather than authored.** The page is
          # Godot's own exported shell - written at export time and overwritten
          # by every build - so there is no index.html in the repository to add
          # a button to. Patching it here keeps the button in one place instead
          # of forking the shell.
          #
          # The href is the releases/latest/download alias, which GitHub resolves
          # to the newest release's asset, so it never needs updating. It is added
          # whether or not an APK exists yet: the Android build is a separate
          # workflow that may not have run, and a button that 404s is better than
          # a publish step that fails because an asset is missing.
          apk="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/BeastRoad.apk"
          {
            printf '<a id="br-apk" href="%s" rel="noopener" style="' "$apk"
            printf 'position:fixed;right:14px;bottom:14px;z-index:99;'
            printf 'font:600 14px/1 system-ui,sans-serif;color:#f2e6cd;'
            printf 'background:rgba(24,26,32,.88);border:1px solid #6c5a3a;'
            printf 'border-radius:8px;padding:11px 15px;text-decoration:none;'
            printf 'box-shadow:0 2px 10px rgba(0,0,0,.45)">Download for Android</a>'
          } > /tmp/br-apk.html
          # Inserted *before* the closing body tag. `sed r` appends after the
          # matched line, which puts the anchor outside the document - browsers
          # reparent it, but only by forgiving the mistake. awk reads the file in
          # whole, so nothing in the markup needs escaping either way.
          awk 'index($0,"</body>") && !done { while ((getline line < "/tmp/br-apk.html") > 0) print line; done=1 } { print }'             build/web/index.html > build/web/index.patched
          mv build/web/index.patched build/web/index.html
          grep -q "br-apk" build/web/index.html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publish release
        # Only on a tag. A manual run builds and uploads artifacts without
        # publishing, which is what you want when rehearsing.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Beast Road ${{ github.ref_name }}
          generate_release_notes: true
          body_path: release_body.md
          files: |
            BeastRoad-windows.zip
            BeastRoad-web.zip
            BeastRoadLauncher.exe
            launcher-version-*.txt
            mirrors.json

  # Publishing the browser build to Pages, which costs nothing and has no deploy
  # quota - the reason this exists is that a metered host ran out mid-debugging
  # and took web co-op testing down with it.
  #
  # Safe on Pages only because the export is single-threaded: a threaded build
  # needs COOP/COEP cross-origin-isolation headers, Pages cannot send them, and
  # the build job fails if `variant/thread_support` is ever turned back on.
  pages:
    name: Publish the browser build
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Pages accepts one deployment at a time, so two releases close together
    # race and the loser fails. Queue them instead - and do not cancel the one
    # in progress, because a half-finished deploy is worse than a slow one.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
