name: Guard

# Does main still compile?
#
# Until now the only workflow ran on `push: tags: v*`, so an ordinary commit was
# never checked by anything. The tree has then sat uncompilable for hours at a
# stretch — `CursorKit` one time, `FactionData` the next — with nobody aware
# until somebody happened to run a gate by hand or tried to cut a release.
#
# That is expensive with one person and worse with three: an agent working on a
# broken tree cannot tell its own breakage from somebody else's, and neither can
# a human.
#
# This is deliberately not the release pipeline. It answers the two questions
# that are never a matter of judgement — does this commit load, and does it
# export — and it names the commit that broke either. The slower,
# judgement-heavy gates (balance, soak, performance) stay on the release
# workflow, because they are legitimately red in the middle of a migration and a
# check that is red for a week is a check people stop reading.
#
# "Does it export" is here because it was previously nowhere: the export first
# ran when a tag had already been pushed, so the way to discover it was broken
# was to spend a version number on it.

on:
  push:
    branches:
      - main
    # Tags are the release workflow's job. Without this, tagging a release runs
    # both and doubles the queue for no extra information.
    tags-ignore:
      - '**'
    # Documentation cannot break a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'References/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# One run per branch. Three of us push in bursts, and there is no value in
# finishing a check for a commit that two newer commits have already replaced.
concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  # Must match the preset name inside both export_presets.cfg files.
  EXPORT_PRESET: Windows Desktop
  # The game project only. The launcher is a desktop installer and has no
  # meaning in a browser.
  WEB_PRESET: Web

jobs:
  compiles:
    name: Does it load
    runs-on: ubuntu-latest
    # A hard ceiling, because the thing this project actually suffers from is
    # hangs rather than failures: a check with no deadline turns a stall into a
    # silent seventy-six minute wait that nobody is watching.
    timeout-minutes: 12

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Shared with the release workflow, and shared as one piece of code rather
      # than as a copied block. This guard used to keep its own leaner version
      # that skipped the export templates, and since it runs on `main` and wins
      # every race, its cache is the one releases restore. Two releases failed
      # on templates that were never in it.
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Validate Update Manager release contract
        shell: pwsh
        run: ./tools/publish_contract_test.ps1

      - name: Import assets
        # A cold checkout has no .godot/ directory and Godot must import once
        # before anything can load. The editor exits non-zero on some headless
        # shutdowns, which is not an import failure - hence the `|| true`.
        run: |
          timeout 300 godot --headless --path game --import || true
          timeout 300 godot --headless --path launcher --import || true

      - name: Register gameplay resource classes
        # class_name Resource types must be in the cold checkout's global class
        # cache before autoloads can type-check against them. Copied verbatim
        # from the release workflow: without it this guard fails on import
        # ordering rather than on real breakage, which is exactly the kind of
        # false alarm that gets a check switched off.
        run: timeout 300 godot --headless --editor --path game --quit

      - name: Load the game, the launcher, and the menu
        run: |
          set -euo pipefail

          # A Godot run that "succeeds" while printing script errors is the
          # normal failure here: exit status alone does not catch a parse error
          # in an autoload. Both are checked, and every call is bounded.
          check() {
            local name="$1"; shift
            local log status
            log="$(mktemp)"
            set +e
            timeout 240 godot "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 124 ]; then
              echo "::error title=$name::Timed out. Something is hanging, not failing."
              return 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error title=$name::Exited $status."
              return 1
            fi
            # A check may declare noise it is allowed to emit, and exactly
            # one does. The rule that *any* warning fails a check is worth
            # keeping absolute for this project's own code; a dependency
            # complaining about the network it is standing in is a different
            # thing, and suppressing it globally would be paying for one check
            # out of every other check's pocket.
            local scan="$log"
            if [ -n "${IGNORE_WARNINGS:-}" ]; then
              scan="$(mktemp)"
              grep -v -E "$IGNORE_WARNINGS" "$log" > "$scan" || true
            fi

            if grep -Eq '^(SCRIPT )?ERROR:|^WARNING:' "$scan"; then
              # The first root-cause line, not the cascade: one missing
              # class_name produces a dozen "failed to compile depended scripts"
              # and only the first line says which identifier is actually absent.
              local first
              first="$(grep -E '^(SCRIPT )?ERROR:|^WARNING:' "$scan" \
                | grep -v 'depended scripts' | head -1)"
              echo "::error title=$name::${first:-emitted an error or warning}"
              return 1
            fi
          }

          check "game" --headless --path game --quit
          check "launcher" --headless --path launcher --quit
          check "tool leak" --headless --path game --script res://tools/run_tool.gd -- tool-leak
          check "http gzip"  --headless --path game --script res://tools/run_tool.gd -- http-gzip
          check "main menu" --headless --path game res://tools/menu_check.tscn
          # Account objectives are finite, one-time and horizontal. This also
          # proves their save payload without touching the runner's real slot.
          check "Chronicle objectives" --headless --path game res://tools/chronicle_check.tscn
          check "save migration" --headless --path game res://tools/save_backup_check.tscn
          check "leaderboard" --headless --path game res://tools/leaderboard_check.tscn
          check "milestone cinematics" --headless --path game res://tools/milestone_cinematic_check.tscn
          # Every manifest asset exists, is the right size, and is real art
          # rather than a magenta-marked placeholder.
          #
          # This ran in the release workflow and in the Update Manager, and
          # nowhere else - so adding one placeholder icon broke publishing and
          # three green pushes went by without saying so. The owner found out by
          # trying to ship. It is a two-second headless script; there is no
          # reason for it to be a thing you discover at the end.
          check "production art" --headless --path game --script res://tools/run_tool.gd -- report
          # Every run currency has purpose-built world art, and ordinary raid
          # supplies cannot be mistaken for the premium locked relic cache.
          check "loot art" --headless --path game res://tools/loot_art_check.tscn
          # Gore is authored and optional: disabling it must suppress only blood,
          # never ordinary hit readability, and the effect must spawn at the
          # replicated impact position rather than at the local hero.
          check "blood VFX" --headless --path game res://tools/blood_vfx_check.tscn
          # Rare recovery stays bounded and run-local; its co-op contract, real
          # art, shader resources and the two-minute blood memory ship together.
          check "recovery and shader polish" --headless --path game res://tools/recovery_polish_check.tscn
          # Matchmaking seats show the same south-facing animated, colour-coded
          # Wardens that enter the battlefield. A static or clipped row is a
          # lobby regression even though the network can still connect.
          check "co-op lobby portraits" --headless --path game res://tools/coop_lobby_check.tscn
          # Every path tile connects on the edges its filename claims. The
          # autotiler picks by index, so a mislabelled tile draws a road that
          # stops dead mid-bend, and the generated set arrived in an order that
          # had nothing to do with the mask.
          check "road tiles" --headless --path game --script res://tools/run_tool.gd -- road-tiles
          # Every region's floor is bright enough to be ground and its two
          # materials belong to the same place. The jungle shipped a base
          # material with a median luminance of 19 out of 255 — across most of
          # the battlefield, for months — and it was found by a person looking at
          # a screenshot, not by anything that runs.
          check "floor tiles" --headless --path game --script res://tools/run_tool.gd -- floor-tiles
          # Thumbs reach the input map, two sticks work at once, and nothing is
          # left held when the controls go away. The machine this is developed on
          # has no touchscreen, so without this the only test is a phone.
          check "touch controls" --headless --path game res://tools/touch_check.tscn
          # The same layout, judged as a phone. Ran by hand until 2026-08-25 and
          # had therefore never actually passed: the interface was overlapping
          # itself in three places and five controls were under the thumb floor,
          # none of which the desktop run can see. A layout check that only ever
          # measures the shape it was authored at is checking the easy case.
          check "layout (phone)" --headless --path game res://tools/layout_check.tscn             -- --touch=on --viewport=430x932
          # **Landscape as well as portrait.** A phone on its side is the shape
          # most people play a game in, and it is a different layout problem:
          # 430x932 has height to spare and no width, so it never noticed a
          # scope rail 1490px tall or an ability slot stretched to 356. Both ran
          # off a landscape screen for months while this gate said PASS.
          check "layout (phone landscape)" --headless --path game res://tools/layout_check.tscn   -- --touch=on --viewport=1280x592
          # The bugs the owner reported on 2026-08-24, held so they stay fixed.
          # Every one of them was a quiet failure rather than a crash - an enemy
          # facing the wrong way, a threat readout describing a wave that had
          # moved on, a boss's pack outliving the act, a dash button eating taps
          # on the main menu. Nothing errored, which is exactly why none of them
          # were caught by anything that runs.
          check "regressions" --headless --path game res://tools/regression_check.tscn
          check "weather"     --headless --path game res://tools/weather_check.tscn
          check "treeline"    --headless --path game res://tools/treeline_check.tscn
          check "wildlife"    --headless --path game res://tools/wildlife_spawn_check.tscn
          check "party reach" --headless --path game res://tools/party_reach_check.tscn
          check "projectile tiers" --headless --path game res://tools/projectile_tier_check.tscn
          # GDD §57 makes "no unreviewed enslavement language ships" a release
          # requirement. It was a thing somebody remembered to do until the
          # 2026-08-25 review found the seeder still writing v3's "Captive",
          # "Bind" and "is bound to the town and put to work" - one run from
          # putting it all back. A release requirement that depends on somebody
          # remembering is not a requirement, it is a hope.
          check "§57 copy" --headless --path game res://tools/copy_check.tscn
          # The summons, and specifically the two properties that keep them a
          # spell rather than the party roster §54 cut: they expire, and there is
          # only ever one. Both would rot silently - a duration that stopped
          # being applied and a second cast that stacked would neither error nor
          # look wrong in a screenshot.
          check "companions" --headless --path game res://tools/companion_check.tscn
          # Traps: laid on roads, in Preparation, and consumed. All three are
          # rules nothing else would notice being broken - a trap that could be
          # dropped mid-combat reopens the locked build phase without erroring,
          # and one that stopped counting down would look entirely normal.
          check "traps" --headless --path game res://tools/trap_check.tscn
          # Co-op step 1: a host and a guest in one process, over a real
          # loopback socket. Two MultiplayerAPI instances can coexist because
          # one is registered per subtree, which is the only reason co-op can be
          # tested on a push at all rather than needing two machines.
          check "co-op transport" --headless --path game res://tools/coop_check.tscn
          # Co-op step 3: two heroes on one field. The hero reads its intentions
          # from a HeroInput rather than from Input directly, and if that ever
          # regresses to a per-call-site "is this hero mine" test, the partner's
          # hero twitches whenever the local player walks - obvious in co-op and
          # invisible to anyone testing alone.
          check "co-op heroes" --headless --path game res://tools/coop_heroes_check.tscn
          # Co-op step 4: mirrored enemies and host-judged building. A puppet
          # decides nothing - it does not walk, take damage or pay out - and a
          # build request is answered by the same try_build a local click uses
          # rather than by a copy of its rules, which would be a second answer.
          check "co-op world" --headless --path game res://tools/coop_world_check.tscn
          # Two WebRTC peers actually connecting and carrying packets, which is
          # the transport the web build and every unforwarded router depend on.
          #
          # It found two real bugs the day it was written. The transport waited
          # on `get_connection_status()`, which a mesh answers CONNECTED to
          # immediately because it is connected to itself - installing a peer
          # whose data channel was still closed. And the offer was coming from
          # the host, where `WebRTCMultiplayerPeer` puts the data channels on
          # the *higher* peer id and expects the offer to come from there.
          # `juice:` is the ICE library reporting a route it could not use -
          # on a runner, `Send failed, errno=101` is ENETUNREACH from an IPv6
          # candidate this machine has no path for. It is a dependency
          # describing the network it is in, the connection succeeds over the
          # routes that do work, and the harness exits 0. Nothing else in this
          # file is allowed to emit a warning of any kind.
          IGNORE_WARNINGS='juice:|rtc::impl' \
            check "webrtc" --headless --path game res://tools/webrtc_check.tscn

      - name: Say what broke
        if: failure()
        run: |
          echo "### main does not load" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA:0:8}\` by ${GITHUB_ACTOR}." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This guard only asks whether the projects load. It does not run" >> "$GITHUB_STEP_SUMMARY"
          echo "balance, soak or performance checks - those stay on the release" >> "$GITHUB_STEP_SUMMARY"
          echo "workflow. If this is red, something does not compile." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce locally:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'godot --headless --path game --quit' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  exports:
    name: Does it export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Loading and exporting are different questions, and the project has only
    # ever been asking the first one. The export ran for the first time when a
    # tag was already pushed and a version number was already spent — so an
    # export that could not work cost v0.4.2, then cost v0.4.3 proving it was
    # not a fluke, and neither run could say why without a signed-in session.
    #
    # Rehearsing it on an ordinary push moves that discovery to somewhere it
    # costs nothing. It runs beside "Does it load" rather than after it, so it
    # adds to the bill and not to the wait.

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import assets
        run: |
          timeout 300 godot --headless --path game --import || true
          timeout 300 godot --headless --path launcher --import || true

      - name: Register gameplay resource classes
        run: timeout 300 godot --headless --editor --path game --quit

      - name: Export the game
        run: bash .github/scripts/export_project.sh game game ../build/game/BeastRoad.exe "$EXPORT_PRESET"

      - name: Export the launcher
        run: bash .github/scripts/export_project.sh launcher launcher ../build/launcher/BeastRoadLauncher.exe "$EXPORT_PRESET"

      # Rehearsed here for the same reason the Windows export is: a web export
      # that cannot work should cost a push, not a version number.
      - name: Export the web build
        run: bash .github/scripts/export_project.sh web game ../build/web/index.html "$WEB_PRESET"

      - name: Check the exports are shippable
        # The same assertions the release makes, made here instead of there.
        # v0.1.0 shipped a launcher whose .pck was left beside it rather than
        # embedded, which fails on the player's machine and nowhere earlier.
        run: |
          set -euo pipefail
          test -s build/game/BeastRoad.exe
          test -s build/game/BeastRoad.pck
          test -s build/launcher/BeastRoadLauncher.exe

          # A web export writes a set of files beside the html, and the one that
          # actually matters is the wasm - index.html alone is what you get when
          # the template is missing pieces.
          for f in index.html index.js index.wasm index.pck; do
            if [ ! -s "build/web/$f" ]; then
              echo "::error title=Web build incomplete::build/web/$f is missing or empty."
              exit 1
            fi
          done

          # Caching rules travel with the build rather than living in a host's
          # dashboard, so a redeploy cannot lose them. Netlify reads `_headers`
          # from the root of whatever is deployed; other static hosts ignore the
          # file harmlessly.
          #
          # The wasm and the pck are content-addressed by the release they came
          # from and are tens of megabytes, so they cache for a year. index.html
          # is the one file that must not: it is what points at the others, and a
          # cached copy of it is how a player ends up running last month's game
          # against this month's data.
          {
            echo '/index.wasm'
            echo '  Cache-Control: public, max-age=31536000, immutable'
            echo '/index.pck'
            echo '  Cache-Control: public, max-age=31536000, immutable'
            echo '/index.js'
            echo '  Cache-Control: public, max-age=31536000, immutable'
            echo '/index.html'
            echo '  Cache-Control: no-cache'
          } > build/web/_headers
          test -s build/web/_headers

          # A threaded build only runs on a cross-origin-isolated page, and a
          # cross-origin-isolated document will not embed in an iframe that is
          # not — which is where this build is going. If this file appears,
          # variant/thread_support got turned back on and the page would load
          # and then fail to start.
          if [ -e build/web/index.worker.js ]; then
            echo "::error title=Web build is threaded::Set variant/thread_support=false in game/export_presets.cfg; Pages cannot send the cross-origin-isolation headers a threaded build needs."
            exit 1
          fi

          if [ -e build/launcher/BeastRoadLauncher.pck ]; then
            echo "::error title=Launcher not shippable::Exported with a separate .pck. Set binary_format/embed_pck=true in launcher/export_presets.cfg."
            exit 1
          fi

          ls -la build/game build/launcher build/web
