name: Guard

# Does main still compile?
#
# Until now the only workflow ran on `push: tags: v*`, so an ordinary commit was
# never checked by anything. The tree has then sat uncompilable for hours at a
# stretch — `CursorKit` one time, `FactionData` the next — with nobody aware
# until somebody happened to run a gate by hand or tried to cut a release.
#
# That is expensive with one person and worse with three: an agent working on a
# broken tree cannot tell its own breakage from somebody else's, and neither can
# a human.
#
# This is deliberately not the release pipeline. It answers the two questions
# that are never a matter of judgement — does this commit load, and does it
# export — and it names the commit that broke either. The slower,
# judgement-heavy gates (balance, soak, performance) stay on the release
# workflow, because they are legitimately red in the middle of a migration and a
# check that is red for a week is a check people stop reading.
#
# "Does it export" is here because it was previously nowhere: the export first
# ran when a tag had already been pushed, so the way to discover it was broken
# was to spend a version number on it.

on:
  push:
    branches:
      - main
    # Tags are the release workflow's job. Without this, tagging a release runs
    # both and doubles the queue for no extra information.
    tags-ignore:
      - '**'
    # Documentation cannot break a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'References/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# One run per branch. Three of us push in bursts, and there is no value in
# finishing a check for a commit that two newer commits have already replaced.
concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  # Must match the preset name inside both export_presets.cfg files.
  EXPORT_PRESET: Windows Desktop
  # The game project only. The launcher is a desktop installer and has no
  # meaning in a browser.
  WEB_PRESET: Web

jobs:
  compiles:
    name: Does it load
    runs-on: ubuntu-latest
    # A hard ceiling, because the thing this project actually suffers from is
    # hangs rather than failures: a check with no deadline turns a stall into a
    # silent seventy-six minute wait that nobody is watching.
    timeout-minutes: 12

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Shared with the release workflow, and shared as one piece of code rather
      # than as a copied block. This guard used to keep its own leaner version
      # that skipped the export templates, and since it runs on `main` and wins
      # every race, its cache is the one releases restore. Two releases failed
      # on templates that were never in it.
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import assets
        # A cold checkout has no .godot/ directory and Godot must import once
        # before anything can load. The editor exits non-zero on some headless
        # shutdowns, which is not an import failure - hence the `|| true`.
        run: |
          timeout 300 godot --headless --path game --import || true
          timeout 300 godot --headless --path launcher --import || true

      - name: Register gameplay resource classes
        # class_name Resource types must be in the cold checkout's global class
        # cache before autoloads can type-check against them. Copied verbatim
        # from the release workflow: without it this guard fails on import
        # ordering rather than on real breakage, which is exactly the kind of
        # false alarm that gets a check switched off.
        run: timeout 300 godot --headless --editor --path game --quit

      - name: Load the game, the launcher, and the menu
        run: |
          set -euo pipefail

          # A Godot run that "succeeds" while printing script errors is the
          # normal failure here: exit status alone does not catch a parse error
          # in an autoload. Both are checked, and every call is bounded.
          check() {
            local name="$1"; shift
            local log status
            log="$(mktemp)"
            set +e
            timeout 240 godot "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 124 ]; then
              echo "::error title=$name::Timed out. Something is hanging, not failing."
              return 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error title=$name::Exited $status."
              return 1
            fi
            if grep -Eq '^(SCRIPT )?ERROR:|^WARNING:' "$log"; then
              # The first root-cause line, not the cascade: one missing
              # class_name produces a dozen "failed to compile depended scripts"
              # and only the first line says which identifier is actually absent.
              local first
              first="$(grep -E '^(SCRIPT )?ERROR:|^WARNING:' "$log" \
                | grep -v 'depended scripts' | head -1)"
              echo "::error title=$name::${first:-emitted an error or warning}"
              return 1
            fi
          }

          check "game" --headless --path game --quit
          check "launcher" --headless --path launcher --quit
          check "tool leak" --headless --path game --script res://tools/run_tool.gd -- tool-leak
          check "main menu" --headless --path game res://tools/menu_check.tscn
          # Every manifest asset exists, is the right size, and is real art
          # rather than a magenta-marked placeholder.
          #
          # This ran in the release workflow and in the Update Manager, and
          # nowhere else - so adding one placeholder icon broke publishing and
          # three green pushes went by without saying so. The owner found out by
          # trying to ship. It is a two-second headless script; there is no
          # reason for it to be a thing you discover at the end.
          check "production art" --headless --path game --script res://tools/run_tool.gd -- report
          # Every path tile connects on the edges its filename claims. The
          # autotiler picks by index, so a mislabelled tile draws a road that
          # stops dead mid-bend, and the generated set arrived in an order that
          # had nothing to do with the mask.
          check "road tiles" --headless --path game --script res://tools/run_tool.gd -- road-tiles

      - name: Say what broke
        if: failure()
        run: |
          echo "### main does not load" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA:0:8}\` by ${GITHUB_ACTOR}." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This guard only asks whether the projects load. It does not run" >> "$GITHUB_STEP_SUMMARY"
          echo "balance, soak or performance checks - those stay on the release" >> "$GITHUB_STEP_SUMMARY"
          echo "workflow. If this is red, something does not compile." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce locally:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'godot --headless --path game --quit' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  exports:
    name: Does it export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Loading and exporting are different questions, and the project has only
    # ever been asking the first one. The export ran for the first time when a
    # tag was already pushed and a version number was already spent — so an
    # export that could not work cost v0.4.2, then cost v0.4.3 proving it was
    # not a fluke, and neither run could say why without a signed-in session.
    #
    # Rehearsing it on an ordinary push moves that discovery to somewhere it
    # costs nothing. It runs beside "Does it load" rather than after it, so it
    # adds to the bill and not to the wait.

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import assets
        run: |
          timeout 300 godot --headless --path game --import || true
          timeout 300 godot --headless --path launcher --import || true

      - name: Register gameplay resource classes
        run: timeout 300 godot --headless --editor --path game --quit

      - name: Export the game
        run: bash .github/scripts/export_project.sh game game ../build/game/BeastRoad.exe "$EXPORT_PRESET"

      - name: Export the launcher
        run: bash .github/scripts/export_project.sh launcher launcher ../build/launcher/BeastRoadLauncher.exe "$EXPORT_PRESET"

      # Rehearsed here for the same reason the Windows export is: a web export
      # that cannot work should cost a push, not a version number.
      - name: Export the web build
        run: bash .github/scripts/export_project.sh web game ../build/web/index.html "$WEB_PRESET"

      - name: Check the exports are shippable
        # The same assertions the release makes, made here instead of there.
        # v0.1.0 shipped a launcher whose .pck was left beside it rather than
        # embedded, which fails on the player's machine and nowhere earlier.
        run: |
          set -euo pipefail
          test -s build/game/BeastRoad.exe
          test -s build/game/BeastRoad.pck
          test -s build/launcher/BeastRoadLauncher.exe

          # A web export writes a set of files beside the html, and the one that
          # actually matters is the wasm - index.html alone is what you get when
          # the template is missing pieces.
          for f in index.html index.js index.wasm index.pck; do
            if [ ! -s "build/web/$f" ]; then
              echo "::error title=Web build incomplete::build/web/$f is missing or empty."
              exit 1
            fi
          done

          # A threaded build needs COOP/COEP headers, which GitHub Pages cannot
          # set. If this file appears, variant/thread_support got turned back on
          # and the page would load and then fail to start.
          if [ -e build/web/index.worker.js ]; then
            echo "::error title=Web build is threaded::Set variant/thread_support=false in game/export_presets.cfg; Pages cannot send the cross-origin-isolation headers a threaded build needs."
            exit 1
          fi

          if [ -e build/launcher/BeastRoadLauncher.pck ]; then
            echo "::error title=Launcher not shippable::Exported with a separate .pck. Set binary_format/embed_pck=true in launcher/export_presets.cfg."
            exit 1
          fi

          ls -la build/game build/launcher build/web
