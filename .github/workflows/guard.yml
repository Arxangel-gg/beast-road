name: Guard

# Does main still compile?
#
# Until now the only workflow ran on `push: tags: v*`, so an ordinary commit was
# never checked by anything. The tree has then sat uncompilable for hours at a
# stretch — `CursorKit` one time, `FactionData` the next — with nobody aware
# until somebody happened to run a gate by hand or tried to cut a release.
#
# That is expensive with one person and worse with three: an agent working on a
# broken tree cannot tell its own breakage from somebody else's, and neither can
# a human.
#
# This is deliberately not the release pipeline. It answers the two questions
# that are never a matter of judgement — does this commit load, and does it
# export — and it names the commit that broke either. The slower,
# judgement-heavy gates (balance, soak, performance) stay on the release
# workflow, because they are legitimately red in the middle of a migration and a
# check that is red for a week is a check people stop reading.
#
# "Does it export" is here because it was previously nowhere: the export first
# ran when a tag had already been pushed, so the way to discover it was broken
# was to spend a version number on it.

on:
  push:
    branches:
      - main
    # Tags are the release workflow's job. Without this, tagging a release runs
    # both and doubles the queue for no extra information.
    tags-ignore:
      - '**'
    # Documentation cannot break a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'References/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# One run per branch. Three of us push in bursts, and there is no value in
# finishing a check for a commit that two newer commits have already replaced.
concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  # Must match the preset name inside both export_presets.cfg files.
  EXPORT_PRESET: Windows Desktop
  # The game project only. The launcher is a desktop installer and has no
  # meaning in a browser.
  WEB_PRESET: Web

jobs:
  compiles:
    name: Does it load
    runs-on: ubuntu-latest
    # A hard ceiling, because the thing this project actually suffers from is
    # hangs rather than failures: a check with no deadline turns a stall into a
    # silent seventy-six minute wait that nobody is watching.
    #
    # **It is a hang guard and not a budget**, and on 2026-09-14 it stopped being
    # read that way: the suite had grown to 106 gates and was finishing in 11m58s
    # against a 12-minute ceiling, so the next two gates added turned a green
    # suite into a cancelled job with no failure in it. A run killed for being
    # one gate too long teaches nothing and costs a whole cycle to work out.
    # Every individual check still carries its own `CHECK_TIMEOUT`, which is the
    # deadline that actually catches a stall.
    #
    # **Raised 20 -> 60 on 2026-09-16, and this is the third time.** 12 was
    # outgrown, then 20, and each time the symptom was the same: a cancelled job
    # with no failure in it, which reads as a broken runner rather than as a
    # suite that got longer. This one hid behind something else - the gate step
    # ran 1101s of an 1100s budget while three gates ahead of it were red, so as
    # soon as those were fixed the run got *further* and hit the wall, and the
    # timeout looked like a regression introduced by the fixes.
    #
    # 60 is deliberate headroom rather than the next rung: 148 gates measured at
    # about 10.5s each locally is ~26 minutes, and a CI runner is slower than
    # this machine. **The real answer is to split this job** so the gates run on
    # several runners at once - that fixes the wall-clock as well as the ceiling,
    # and it is what should happen the next time this number is questioned rather
    # than a fourth bump.
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Shared with the release workflow, and shared as one piece of code rather
      # than as a copied block. This guard used to keep its own leaner version
      # that skipped the export templates, and since it runs on `main` and wins
      # every race, its cache is the one releases restore. Two releases failed
      # on templates that were never in it.
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Validate Update Manager release contract
        shell: pwsh
        run: ./tools/publish_contract_test.ps1

      - name: Validate CI failure diagnostics
        # Failure diagnostics must work even when Godot prints no error line.
        # Covered before importing or spending time on the gameplay suite.
        run: bash tools/ci_validation_test.sh

      - name: Import assets
        # A cold checkout has no .godot/ directory and Godot must import once
        # before anything can load. The editor exits non-zero on some headless
        # shutdowns, which is not an import failure - hence the `|| true`.
        run: |
          timeout 300 godot --headless --path game --import || true
          timeout 300 godot --headless --path launcher --import || true

      - name: Register gameplay resource classes
        # class_name Resource types must be in the cold checkout's global class
        # cache before autoloads can type-check against them. Copied verbatim
        # from the release workflow: without it this guard fails on import
        # ordering rather than on real breakage, which is exactly the kind of
        # false alarm that gets a check switched off.
        run: timeout 300 godot --headless --editor --path game --quit

      - name: Load the game, the launcher, and the menu
        run: |
          set -euo pipefail

          # A Godot run that "succeeds" while printing script errors is the
          # normal failure here: exit status alone does not catch a parse error
          # in an autoload. Both are checked, and every call is bounded.
          check() {
            local name="$1"; shift
            local log status
            log="$(mktemp)"
            set +e
            # 240s suits a gate that boots, asserts and quits, which is nearly
            # all of them. It does *not* suit one that has to watch the clock:
            # `breather` measures two complete wave cycles and so spends 210
            # real seconds by construction, leaving about 11% margin on a shared
            # runner. That is a timeout waiting to fire on a busy afternoon and
            # report a hang that never happened.
            #
            # Overridable per call, like IGNORE_WARNINGS below, rather than
            # raised for everybody: the ceiling is what turns a hang into a
            # named failure instead of a silent twelve-minute wait, and it is
            # worth keeping tight everywhere it can be.
            timeout "${CHECK_TIMEOUT:-240}" godot "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 124 ]; then
              echo "::error title=$name::Timed out. Something is hanging, not failing."
              return 1
            fi
            # **A crash is not an assertion, and the difference is the whole
            # diagnosis.**
            #
            # This is what actually broke the v0.6.2 run. `menu_layout_check`
            # ran, passed, printed its PASS line - and then segfaulted inside
            # engine shutdown, on Linux only. The log therefore held no `ERROR:`
            # and no `FAIL`, because a crash prints neither, and every scan
            # below it had nothing to find.
            #
            # `timeout` returns 128+N when the child dies on signal N, so the
            # status was 139. "Exited 139" is true and tells you nothing; 139 is
            # 128+11 and 11 is SIGSEGV. Naming it turns "some gate failed" into
            # "that gate crashed rather than failed an assertion", which is a
            # completely different investigation - and quoting the last line
            # says *where*, which here was after a PASS.
            if [ "$status" -gt 128 ]; then
              local signal_name
              case "$((status - 128))" in
                4)  signal_name="SIGILL (illegal instruction)" ;;
                6)  signal_name="SIGABRT (abort - often a failed engine assertion)" ;;
                8)  signal_name="SIGFPE (arithmetic fault)" ;;
                9)  signal_name="SIGKILL (killed - suspect the runner running out of memory)" ;;
                11) signal_name="SIGSEGV (segmentation fault)" ;;
                *)  signal_name="signal $((status - 128))" ;;
              esac
              echo "::error title=$name::Crashed with $signal_name, not an assertion. Last output: $(tail -n 1 "$log")"
              return 1
            fi
            if [ "$status" -ne 0 ]; then
              # **Say what it said, not just that it failed.**
              #
              # A gate that exits non-zero used to annotate "Exited 1." and
              # nothing else, because the log was only scanned on a *zero* exit.
              # Every gate here quits non-zero when it fails, so in practice the
              # reason was never quoted - and a failure that reproduces on the
              # runner and nowhere else is then unfixable without pulling the
              # log by hand. Cost a red main and a wrong diagnosis to find.
              local why
              # awk returns success even with no match and consumes no pipe.
              # grep/head under pipefail could abort this reporter before the
              # annotation, hiding the original failure behind exit code 1.
              why="$(awk '/^(SCRIPT )?ERROR:|^WARNING:|FAIL/ && !/depended scripts/ { print; exit }' "$log")"
              # **Second look, for the gates that indent on purpose.**
              #
              # Everything under tools/ that reports its own findings prints
              # them as "  ERROR: ..." rather than at the start of a line, so
              # that a tool describing a problem can never be mistaken for the
              # engine failing and fail an otherwise clean run. `run_tool.gd`
              # says so in as many words.
              #
              # The consequence nobody had joined up: that also hides the
              # finding from the scan above, which anchors. A failing
              # report/road-tiles/floor-tiles/tool-leak gate therefore exits 1
              # having printed exactly what was wrong, and annotated "no reason
              # printed" - the useless annotation this reporter exists to stop,
              # on the one family of gates that had already done the work.
              #
              # Safe because it only runs on an already-failing status and only
              # when the anchored scan found nothing. The scan that *decides*
              # whether a clean run is dirty stays anchored, below.
              if [ -z "$why" ]; then
                why="$(awk '/^[[:space:]]+(SCRIPT )?ERROR:/ { print; exit }' "$log")"
              fi
              echo "::error title=$name::Exited $status. ${why:-no reason printed}"
              return 1
            fi
            # A check may declare noise it is allowed to emit, and exactly
            # one does. The rule that *any* warning fails a check is worth
            # keeping absolute for this project's own code; a dependency
            # complaining about the network it is standing in is a different
            # thing, and suppressing it globally would be paying for one check
            # out of every other check's pocket.
            local scan="$log"
            if [ -n "${IGNORE_WARNINGS:-}" ]; then
              scan="$(mktemp)"
              grep -v -E "$IGNORE_WARNINGS" "$log" > "$scan" || true
            fi

            if grep -Eq '^(SCRIPT )?ERROR:|^WARNING:' "$scan"; then
              # The first root-cause line, not the cascade: one missing
              # class_name produces a dozen "failed to compile depended scripts"
              # and only the first line says which identifier is actually absent.
              local first
              first="$(awk '/^(SCRIPT )?ERROR:|^WARNING:/ && !/depended scripts/ { print; exit }' "$scan")"
              echo "::error title=$name::${first:-emitted an error or warning}"
              return 1
            fi
          }

          check "game" --headless --path game --quit
          check "launcher" --headless --path launcher --quit
          # The download-mirror fallback, which Release ran and Guard did not.
          # It is the only gate over the path a player behind a national filter
          # takes, and that path was broken for as long as it existed: the mirror
          # list was published only as a release asset, on the same CDN the
          # mirrors route around. A regression here is invisible to everyone who
          # can reach GitHub, which is everyone who would notice.
          check "launcher pipeline" --headless --path launcher res://tests/release_pipeline_test.tscn
          check "tool leak" --headless --path game --script res://tools/run_tool.gd -- tool-leak
          # Test the audit's evidence classification, not subjective completion.
          check "audit evidence" --headless --path game res://tools/gdd_audit_check.tscn
          check "http gzip"  --headless --path game --script res://tools/run_tool.gd -- http-gzip
          check "main menu" --headless --path game res://tools/menu_check.tscn
          # Account objectives are finite, one-time and horizontal. This also
          # proves their save payload without touching the runner's real slot.
          check "Chronicle objectives" --headless --path game res://tools/chronicle_check.tscn
          check "pinned Chronicle goals" --headless --path game res://tools/chronicle_goal_check.tscn
          check "save migration" --headless --path game res://tools/save_backup_check.tscn
          # The rename must never move user://. Every existing save lives in the
          # folder this pins, and a title change that carried the folder with it
          # would show every player a fresh account without a single error.
          check "user dir" --headless --path game res://tools/user_dir_check.tscn
          check "leaderboard" --headless --path game res://tools/leaderboard_check.tscn
          check "milestone cinematics" --headless --path game res://tools/milestone_cinematic_check.tscn
          # Every manifest asset exists, is the right size, and is real art
          # rather than a magenta-marked placeholder.
          #
          # This ran in the release workflow and in the Update Manager, and
          # nowhere else - so adding one placeholder icon broke publishing and
          # three green pushes went by without saying so. The owner found out by
          # trying to ship. It is a two-second headless script; there is no
          # reason for it to be a thing you discover at the end.
          check "production art" --headless --path game --script res://tools/run_tool.gd -- report
          # Every run currency has purpose-built world art, and ordinary raid
          # supplies cannot be mistaken for the premium locked relic cache.
          check "loot art" --headless --path game res://tools/loot_art_check.tscn
          # Everything that should move, moves; and rocks do not. The sway table
          # says which kinds animate, so a kind that leans without breathing - or
          # a boulder that breathes - is a mismatch between two files that used to
          # be nobody's job to compare.
          check "foliage animation" --headless --path game res://tools/foliage_art_check.tscn
          # Gore is authored and optional: disabling it must suppress only blood,
          # never ordinary hit readability, and the effect must spawn at the
          # replicated impact position rather than at the local hero.
          check "blood VFX" --headless --path game res://tools/blood_vfx_check.tscn
          # Rare recovery stays bounded and run-local; its co-op contract, real
          # art, shader resources and the two-minute blood memory ship together.
          check "recovery and shader polish" --headless --path game res://tools/recovery_polish_check.tscn
          # Matchmaking seats show the same south-facing animated, colour-coded
          # Wardens that enter the battlefield. A static or clipped row is a
          # lobby regression even though the network can still connect.
          check "co-op lobby portraits" --headless --path game res://tools/coop_lobby_check.tscn
          # Every path tile connects on the edges its filename claims. The
          # autotiler picks by index, so a mislabelled tile draws a road that
          # stops dead mid-bend, and the generated set arrived in an order that
          # had nothing to do with the mask.
          check "road tiles" --headless --path game --script res://tools/run_tool.gd -- road-tiles
          # Every region's floor is bright enough to be ground and its two
          # materials belong to the same place. The jungle shipped a base
          # material with a median luminance of 19 out of 255 — across most of
          # the battlefield, for months — and it was found by a person looking at
          # a screenshot, not by anything that runs.
          check "floor tiles" --headless --path game --script res://tools/run_tool.gd -- floor-tiles
          # Thumbs reach the input map, two sticks work at once, and nothing is
          # left held when the controls go away. The machine this is developed on
          # has no touchscreen, so without this the only test is a phone.
          check "touch controls" --headless --path game res://tools/touch_check.tscn
          # The same layout, judged as a phone. Ran by hand until 2026-08-25 and
          # had therefore never actually passed: the interface was overlapping
          # itself in three places and five controls were under the thumb floor,
          # none of which the desktop run can see. A layout check that only ever
          # measures the shape it was authored at is checking the easy case.
          check "ui tint" --headless --path game res://tools/ui_tint_check.tscn
          check "layout (phone)" --headless --path game res://tools/layout_check.tscn             -- --touch=on --viewport=430x932
          # **Landscape as well as portrait.** A phone on its side is the shape
          # most people play a game in, and it is a different layout problem:
          # 430x932 has height to spare and no width, so it never noticed a
          # scope rail 1490px tall or an ability slot stretched to 356. Both ran
          # off a landscape screen for months while this gate said PASS.
          check "layout (phone landscape)" --headless --path game res://tools/layout_check.tscn   -- --touch=on --viewport=1280x592
          # The bugs the owner reported on 2026-08-24, held so they stay fixed.
          # Every one of them was a quiet failure rather than a crash - an enemy
          # facing the wrong way, a threat readout describing a wave that had
          # moved on, a boss's pack outliving the act, a dash button eating taps
          # on the main menu. Nothing errored, which is exactly why none of them
          # were caught by anything that runs.
          check "regressions" --headless --path game res://tools/regression_check.tscn
          check "weather"     --headless --path game res://tools/weather_check.tscn
          check "treeline"    --headless --path game res://tools/treeline_check.tscn
          check "wildlife"    --headless --path game res://tools/wildlife_spawn_check.tscn
          check "ranged"      --headless --path game res://tools/ranged_check.tscn
          check "elites"      --headless --path game res://tools/elite_check.tscn
          # Enemies walk on their own legs rather than sliding. Both halves fail
          # silently: frames that exist but are not found by convention, and a
          # loader "fixed" to include the resting pose in the cycle.
          check "enemy walk" --headless --path game res://tools/enemy_walk_check.tscn
          # Consumables are content. The gate that matters is the last one: an
          # effect nothing reads would be taken, drawn, and do nothing.
          check "items" --headless --path game res://tools/item_check.tscn
          check "merchants" --headless --path game res://tools/merchant_check.tscn
          # What the run is like *after* a raid, which nothing had ever looked at:
          # the raid claimed the effect world and never gave it back, and camp
          # bodies fell back to the map origin instead of coming for the hero.
          check "raid return" --headless --path game res://tools/raid_return_check.tscn
          # Healing orbs and supply crates: rare, scaled to what dropped them,
          # and capped so neither can pay for a mistake the curve punishes.
          check "recovery drops" --headless --path game res://tools/recovery_drop_check.tscn
          # A healing well fills, pours once for somebody genuinely hurt, and
          # does not become a regeneration aura the wave curve is blind to.
          check "healing wells" --headless --path game res://tools/healing_well_check.tscn
          # Two players swapping gear. Every failure here is silent and
          # permanent, so the duplication cases are gated before anything else.
          check "trading" --headless --path game res://tools/trade_check.tscn
          # The Long Ledger holds gear in escrow and pays Marks for it. A
          # marketplace that duplicates a piece, eats one, or leaves a gap
          # between its buy price and the stash's sell price fails nothing and
          # ruins the between-run economy over weeks.
          check "exchange" --headless --path game res://tools/exchange_check.tscn
          # A portent that charges nothing is a free upgrade in a costume: the
          # card still draws, still says the words, and the run gets easier the
          # more you read. Nothing errors.
          check "omens" --headless --path game res://tools/omen_check.tscn
          # A third draft pool is the thing IDEAS_REVIEW refused, so what
          # makes it safe is that the hand is bounded and the bound is in one
          # function. If the cap or the one-card-per-key rule can be walked
          # around, twenty crossroads become twenty upgrades and nothing errors.
          check "road cards" --headless --path game res://tools/road_card_check.tscn
          # Every authored .tres actually became content. ContentDB warns and
          # carries on when one will not parse, so the dictionary goes quietly
          # short and every gate over that content keeps passing on what did
          # load. Five blueprints were missing this way and ranged_check still
          # printed a healthy number.
          check "content" --headless --path game res://tools/content_check.tscn
          # Kill momentum escalates the feedback and nothing else. The bound is
          # the point: a streak that raised damage would be a difficulty change
          # the three-act curve was never tuned against, and it would read as
          # polish in review.
          check "momentum" --headless --path game res://tools/momentum_check.tscn
          # The spirit collection: rarer must need fewer encounters, the power
          # ladder must never invert, and a shiny must never be worth less than
          # a plain variant. Also that an old save loads as an empty collection.
          check "spirits" --headless --path game res://tools/spirit_check.tscn
          # Fire, ice and the wind-up tell are material rather than tint since
          # 2026-09-01, and every one of them fails silently: a shader that
          # stops being driven still draws, it just draws nothing, and the game
          # plays exactly as it did with the state invisible. Both actor
          # shaders have to carry it, because a promoted body wears the other
          # one - which is how champions were unreachable to begin with.
          check "state shader" --headless --path game res://tools/state_shader_check.tscn
          # A Spirit Companion's personality. The bound is that none of them is
          # simply better - a trait that raised damage would be a third power
          # scale beside levelling and gear, and the best trait would become the
          # only one worth keeping. Also that both machines derive the same
          # personality from the same animal without a packet, which is the
          # desync the shiny roll had.
          check "spirit traits" --headless --path game res://tools/spirit_trait_check.tscn
          # Enemies break when their champion falls. The bound is that morale
          # changes the shape of a fight and never its size: a routed body comes
          # back, still counts and still pays out. If breaking one removed it,
          # every wave in the game would quietly get shorter and the three-act
          # curve would be measuring something that no longer happens.
          check "morale" --headless --path game res://tools/morale_check.tscn
          # A dash that answers a blow beats one thrown early. The bound is that
          # the reward is tempo and never damage - hero power is on one capped
          # scale - and that a crowd cannot refund the same dash repeatedly,
          # which would make dashing free for standing in the worst place.
          check "perfect evade" --headless --path game res://tools/evade_check.tscn
          # The end-of-run build recap. Every corner a run can finish in has to
          # resolve to a name, and the name has to describe what happened - a
          # tie between two elements settled on neither, and saying otherwise is
          # the recap flattering the player rather than describing them.
          check "run recap" --headless --path game res://tools/recap_check.tscn
          # Every glyph the interface prints must exist in a shipped font.
          # Godot borrows a missing one from a system face on desktop and has
          # nothing to borrow from on Android, so a gap renders correctly on
          # every machine the game is developed on and as an empty box on the
          # one it is played on. Eleven had accumulated before anybody looked at
          # a phone.
          check "font glyphs" --headless --path game res://tools/font_glyph_check.tscn
          # Every menu panel, opened at phone size, with its way out on screen.
          # layout_check builds the *run* and measures the HUD; nothing ever
          # opened a main-menu panel at a phone shape and looked. The same bug
          # has now been reported in three of these screens.
          check "menu layout" --headless --path game res://tools/menu_layout_check.tscn
          # Every town plot answers a click, including while a building sheet is
          # open. The sheet docks full-height down the left of the screen and the
          # plot ring is centred on the viewport, so the left of the ring used to
          # sit underneath it and go dead. Reported from play as "buildings on
          # the bottom half are not selectable"; menu_layout_check opens *menu*
          # panels and had no opinion about the world beneath a docked one.
          check "town clicks" --headless --path game res://tools/town_click_check.tscn
          # Every content resource's derived sprite exists. The manifest and
          # `report` both work outward from what is *declared*, so an asset
          # nobody remembered to declare is missing from the manifest, from disk
          # and from every check at once. Six spell icons shipped that way: the
          # spells worked, their sockets rendered, and each drew nothing.
          check "content art" --headless --path game res://tools/content_art_check.tscn
          check "codex"       --headless --path game res://tools/codex_check.tscn
          # A cosmetic gate has to bind a world before it looks for the
          # effect, or it agrees with a game that draws nothing. This one
          # was written after regression_check passed a blade that never
          # rendered, and its angle assertion was itself wrong once - it
          # scored the bug higher than the fix until it was made to fail.
          check "weapon vfx" --headless --path game res://tools/weapon_vfx_check.tscn
          # A fork used to go to whoever clicked first, so the fastest player
          # chose every road for the party. Votes decide it now, and the two
          # ways that can break are both silent: a tie that resolves
          # differently on two machines walks them down different roads, and a
          # vote waiting on everybody lets one idle player stall the run.
          check "crossroad vote" --headless --path game res://tools/crossroad_vote_check.tscn
          # A gate that edits MetaState must never persist it. One did, and a
          # played stash is the only thing here that neither git nor a
          # re-import can bring back.
          check "save guard" --headless --path game res://tools/save_guard_check.tscn
          # And the other half of the same subject: what the game itself writes
          # into a save must be something it can read back. A settings key the
          # loader does not declare saves perfectly and is thrown away on load,
          # which is how a played account was handed a free weapon on every
          # launch for weeks without anything failing.
          check "save round trip" --headless --path game res://tools/save_round_trip_check.tscn
          # An extension with no library for a platform the game ships to
          # constructs happily and then fails at runtime, on that platform
          # only. WebRTC shipped without an Android binary and co-op could
          # never have worked on a phone; nothing here noticed, because the
          # export succeeds and the game runs.
          check "extension platforms" --headless --path game res://tools/extension_platform_check.tscn
          # A body knocked clear of the road used to keep aiming at the
          # waypoint it left, which after a hard shove is behind it or across
          # a bend - so it walked diagonally over ground the road does not
          # cover. Reported from play.
          check "reanchor" --headless --path game res://tools/reanchor_check.tscn
          # This gate existed and passed for months without any workflow
          # running it, which is how the discipline rotation shipped offering
          # three of twenty-seven nodes: every assertion asked for three
          # unique offers and got three unique offers - the same three.
          check "disciplines" --headless --path game res://tools/discipline_check.tscn
          # Spells cost mana and Focus delivers what the Mansion promises.
          check "mana" --headless --path game res://tools/mana_check.tscn
          # A ranged spell that lands on the caster, lands instantly, or never
          # lands at all costs mana and draws its ring either way. Nothing
          # errors; it is simply a different spell than the one described.
          check "ranged spells" --headless --path game res://tools/spell_strike_check.tscn
          # Ponds, the meal cap, and the pantry that outlives a run.
          check "fishing" --headless --path game res://tools/fishing_check.tscn
          # Rifts and dungeons: the gates on the field, the fill, the guardian,
          # the door, and a reward that is only ever what the road already pays.
          check "rifts" --headless --path game res://tools/rift_check.tscn
          # The maze under a rift (2026-09-12): one connected floor from the
          # entry, a vault at a real depth, bodies that appear on floor and are
          # steered by the maze rather than into rock.
          check "dungeon maze" --headless --path game res://tools/dungeon_check.tscn
          # The road home: the pass after an act's boss, its stakes, and the
          # return it pays in full.
          check "the road home" --headless --path game res://tools/homecoming_check.tscn
          # The welcome: a guest whose field has just stood up is told the run
          # as it stands, so a drop can be followed by a rejoin.
          check "rejoin" --headless --path game res://tools/rejoin_check.tscn
          # The Farmer: plots, seeds, growth by road at the ground's pace,
          # the harvest, and a craft that touches nothing but the craft.
          check "farming" --headless --path game res://tools/farming_check.tscn
          # The party's conversation before a raid or a rift: unanimous goes and
          # freezes, a mixed answer is the proposer's call, silence is a no, and
          # the first return thaws the field once.
          check "party events" --headless --path game res://tools/party_events_check.tscn
          # Every guide section has a tab and a picture on disk; every
          # achievement names a statistic the account actually keeps.
          check "guide" --headless --path game res://tools/guide_check.tscn
          # A legendary affix moves a key Modifiers resolves, by a bounded
          # amount, deterministically from the piece's own name.
          check "gear affixes" --headless --path game res://tools/gear_affix_check.tscn
          # The camps on the outskirts: three a road, camp-mode bodies, the
          # fork that both razed camps open, the respawn, and the war camp's
          # dungeon mouth.
          check "camps" --headless --path game res://tools/camps_check.tscn
          # Ponds draw under the hero and the hero swims in them.
          check "swimming" --headless --path game res://tools/swim_check.tscn
          check "pond fish" --headless --path game res://tools/pond_fish_check.tscn
          check "taming" --headless --path game res://tools/taming_check.tscn
          check "exchange render" --headless --path game res://tools/exchange_render_check.tscn
          # The fog of war covers the road, the hero and the towers lift it,
          # walked ground stays known, the minimap darkens with the field's own
          # fog texture, and every dungeon stage is fresh discovery.
          check "fog of war" --headless --path game res://tools/fog_check.tscn
          check "beast tail" --headless --path game res://tools/beast_tail_check.tscn
          # Every parallax layer covers the whole screen wherever it is on its
          # own scroll. Three classes each laid their content from their own
          # origin forward, and the camera sits on that origin, so the left of
          # the view was bare for half of every period.
          check "parallax cover" --headless --path game res://tools/parallax_cover_check.tscn
          # Shaders do not compile under --headless, so no gate in this suite
          # has ever read a line of GLSL. The city health ring shipped with a
          # `const float TAU` in it, failed to compile on every real machine,
          # and drew nothing. This reads the source for the traps that fail
          # silently; run a `*_shot` tool windowed for the rest.
          check "shader lint" --headless --path game res://tools/shader_lint_check.tscn
          # The sky: rain that swells on its own, lightning that charges the
          # air, a flood that slows and drowns, heat that dries the wells, and
          # the guest told the same four numbers. Every half of it is measured.
          check "sky" --headless --path game res://tools/sky_check.tscn
          # The earth's wrath: kills feed it, it leans the weather, and it shakes,
          # burns, spins and throws stones - each measured on the real field.
          check "wrath" --headless --path game res://tools/wrath_check.tscn
          # The ground's own weather: sources add with falloff, heat spreads
          # and cools, rain wets and heat dries, cells sleep, bands cross once,
          # the guest eases, and the wells and the fire read the ground.
          check "climate" --headless --path game res://tools/climate_check.tscn
          # Wet and its reactions: conductive, flash freeze, steam; water wets,
          # rain wets everybody; a spell of an element touches the world.
          check "reactions" --headless --path game res://tools/reaction_check.tscn
          # What a blow lands on: every breed names a hide, the landed signal
          # carries the one struck, and the sound, sparks and hitstop follow it.
          check "hit feel" --headless --path game res://tools/hit_feel_check.tscn
          # The director may change how something is presented and never whether
          # it happened. Holds the priority order, the floors, the comfort scales
          # at both ends, and - driven rather than asserted - that a real body
          # killed with every scale at zero takes the same blows and pays the
          # same Gold as one killed with everything on.
          check "juice director" --headless --path game res://tools/juice_director_check.tscn
          # The debrief says what the road paid whatever happened and what the
          # earth did: counted where each gain is banked and each event seen.
          check "debrief" --headless --path game res://tools/debrief_check.tscn
          # Tested like a hostile player: the sell loop, the drop collected
          # twice, the puppet, the stash overflow, the XP cap, the ceiling.
          check "exploits" --headless --path game res://tools/exploit_check.tscn
          # The budgets are constants and the things they bound refuse to
          # exceed them: the director waits at the cap, the wildlife stops.
          check "budgets" --headless --path game res://tools/budget_check.tscn
          # The raccoon: born with its sack less than always, takes the richest
          # drop, runs it to cover, breaks cover for a hero, forages, drops all.
          check "thieves" --headless --path game res://tools/raccoon_check.tscn
          # The act is warm before it is fought: every roster, wildlife and
          # tower frame in the loader's cache, every shader compiled, and the
          # field does it itself when it lays the region out.
          check "warm-up" --headless --path game res://tools/warmup_check.tscn
          check "enemy facing" --headless --path game res://tools/enemy_facing_check.tscn
          check "scroll and zoom" --headless --path game res://tools/scroll_zoom_check.tscn
          check "boss reach" --headless --path game res://tools/boss_reach_check.tscn
          check "enemy repertoire" --headless --path game res://tools/enemy_repertoire_check.tscn
          check "balance reach" --headless --path game res://tools/balance_reach_check.tscn
          # A tower's split at level five and its capstone at ten: the choice
          # waits for its level, is made once, and moves only numbers the
          # tower already had.
          check "tower paths" --headless --path game res://tools/tower_path_check.tscn
          # Every tower authors a look of its own - shot style, air, colour,
          # kick - and none of it moves a number: one tower of each style is
          # fired at a body on the real field and the damage read back.
          check "tower juice" --headless --path game res://tools/tower_juice_check.tscn
          # Where the players fell: one stone per hero down, falling, landing and
          # dissolving on revival; remains until the act ends; every death path.
          check "death markers" --headless --path game res://tools/death_marker_check.tscn
          # Eight towers an element, and the five support towers measured on
          # the real field: the window, the reach, the mend, the mirror, the
          # wind-up.
          check "tower support" --headless --path game res://tools/tower_support_check.tscn
          # Families, births, growth and the Wildblight: the inheritance odds
          # measured, the bounds held, and a frenzy that works on a rabbit.
          check "wildlife families" --headless --path game res://tools/wildlife_family_check.tscn
          # The menu's corner plants: the three painted pieces on disk and
          # drawn rather than the silhouette fallback, and a sway with no loop
          # a viewer could notice inside three minutes.
          check "menu foliage" --headless --path game res://tools/menu_foliage_check.tscn
          # The wind: bounded and symmetric on every mover, nothing felt
          # indoors, every quarter of the compass over a run, and two numbers
          # on the wire with no foliage anywhere near it.
          check "wind" --headless --path game res://tools/wind_check.tscn
          # The menu's birds and fireflies: four wingbeats on disk, birds
          # tiny against the gate and never piling up, and a swarm that keeps
          # its own time over the valley.
          check "menu life" --headless --path game res://tools/menu_life_check.tscn
          # The interface's holograms: additive and bounded so no glyph
          # loses contrast, one skin a button however often the HUD rebuilds,
          # and the pad answered exactly as the mouse is.
          check "ui juice" --headless --path game res://tools/ui_juice_check.tscn
          # The watcher on the road: every piece on disk, a figure that is
          # never black on black, standing on the rock's lip rather than its
          # topmost blade of grass, clear of the interface, and different
          # every visit.
          check "menu camp" --headless --path game res://tools/menu_camp_check.tscn
          # The carved border round the menu: it covers every button on the
          # screen and must never be able to take a press, it may only ever add
          # light, its sheen travels rather than the whole frame brightening,
          # and a press is answered at the edge it landed near.
          check "menu frame" --headless --path game res://tools/menu_frame_check.tscn
          # Rank said in light: the pass adds and never darkens, nothing
          # ordinary is lit, the ladder climbs to a legendary shiny, and the
          # sheen never takes the sprite's own material - which belongs to the
          # status polish.
          check "rank sheen" --headless --path game res://tools/rank_sheen_check.tscn
          check "phenotype" --headless --path game res://tools/phenotype_check.tscn
          check "mythic trail" --headless --path game res://tools/mythic_trail_check.tscn
          check "nesting" --headless --path game res://tools/nesting_check.tscn
          check "dragon" --headless --path game res://tools/dragon_check.tscn
          check "feel" --headless --path game res://tools/feel_check.tscn
          check "stagger" --headless --path game res://tools/stagger_check.tscn
          check "gear set" --headless --path game res://tools/gear_set_check.tscn
          # The stash drawn at the worst case it can be asked to draw: the top
          # rarity at full level in every slot, and a complete set. The card
          # sizes itself from a *count*, and a count is exactly the kind of
          # thing that goes quietly wrong - at 104 the best gear in the game
          # had its last row of bonuses drawn under its own border.
          check "stash render" --headless --path game res://tools/stash_render_check.tscn
          check "pen" --headless --path game res://tools/pen_check.tscn
          check "expedition" --headless --path game res://tools/expedition_check.tscn
          check "wave library" --headless --path game res://tools/wave_library_check.tscn
          check "journey" --headless --path game res://tools/journey_check.tscn
          check "act start" --headless --path game res://tools/act_start_check.tscn
          # The Hold as a place, the Market's shelf and Orden's commission:
          # every station presses a door that exists, the shelf keeps its
          # stock across a restart, and buying is always dearer than selling.
          check "hold" --headless --path game res://tools/hold_check.tscn
          # The Walk pays its ledger once and moves no statistic, no level and
          # no purse - and a once-only flag that is never read back is a fault
          # this project has already shipped.
          check "walk" --headless --path game res://tools/tutorial_walk_check.tscn
          # Mounts: a gallop is no faster than a sprint, a rider cannot
          # fight, attacking gets them down and lets the swing through, and
          # the stable spends Marks and creates nothing.
          check "mount" --headless --path game res://tools/mount_check.tscn
          # The walk can see what the earth is doing to the town: every
          # disaster reaches the road, the readout changes nothing, nothing
          # stays on screen for ever, and a quake moves Yuri and not only the
          # camera.
          check "beast omens" --headless --path game res://tools/beast_omens_check.tscn
          # What a breed does that you remember it for: every behaviour
          # authored and told before it happens, a guard that turns one blow
          # and is spent, and a shield that redirects rather than reduces.
          check "enemy behaviour" --headless --path game res://tools/enemy_behaviour_check.tscn
          # Five attributes, and the fifth adds choices rather than points: a
          # level still grants exactly one, and gear still divides its budget.
          check "attributes" --headless --path game res://tools/attribute_check.tscn
          # Five ranged answers instead of one, and the bound that keeps them
          # honest: a shot changes the shape of a blow, never its size.
          check "enemy shots" --headless --path game res://tools/enemy_shot_check.tscn
          # Woodcutting, mining and the forge: a new account holds nothing, nodes
          # stand outside the city's square, and the forge only ever makes gear.
          check "gathering" --headless --path game res://tools/gathering_check.tscn
          # Nineteen coach steps over nineteen triggers, each fired by something
          # and each in range. Twelve were one place out when this was written.
          check "tutorial" --headless --path game res://tools/tutorial_check.tscn
          # The battlefield playlist deals what is on disk, advances on the end
          # of a song, holds for a boss and hands back. Missing songs are quiet.
          check "music" --headless --path game res://tools/music_check.tscn
          # Every script compiles. `--quit` compiles the autoloads and the main
          # scene and nothing else; a parse error in a screen the menu has not
          # opened sat there until a player reached it.
          check "scripts" --headless --path game res://tools/script_check.tscn
          # Seven gates that existed, passed, and were run by nothing. The
          # discipline rotation shipped broken behind one of these, and two of
          # them back release requirements: raid_suspend is the probe
          # V4_CONFORMANCE cites for GDD 52's "raid pause resumes exact
          # state", and seed_reproduction is the one it cites for seed
          # determinism. A requirement whose only evidence is that a file
          # exists is not evidenced.
          check "raid suspend" --headless --path game res://tools/raid_suspend_check.tscn
          check "seed reproduction" --headless --path game res://tools/seed_reproduction_check.tscn
          check "boot" --headless --path game res://tools/boot_check.tscn
          # Spends 210 real seconds watching two complete wave cycles, so the
          # default 240s ceiling is 11% margin rather than a hang detector.
          CHECK_TIMEOUT=420 \
            check "breather" --headless --path game res://tools/breather_check.tscn
          check "live settings" --headless --path game res://tools/live_settings_check.tscn
          check "support diagnostics" --headless --path game res://tools/support_diagnostics_check.tscn
          check "structures" --headless --path game res://tools/structure_check.tscn
          check "torches" --headless --path game res://tools/torch_check.tscn
          # **Back in the gate on 2026-09-08, after five days out of it.**
          #
          # The old crowd_check passed on Windows and failed on Linux, and was
          # commented out here because nobody knew why - re-adding it risked a
          # red main, which made it an owner's call rather than an agent's.
          #
          # The 2026-09-07 rewrite (seeded, fixed-step, sorted fixtures, and
          # tearing itself down before quitting rather than quitting on top of
          # fourteen live enemies) was believed to fix it, but "believed" is not
          # a Linux result. So it ran first as a reporting-only step that could
          # not fail the build - the cost of being wrong removed rather than
          # accepted - and that step answered the question on its first push:
          #
          #     [crowd] platform=Linux  ... overlap 42.000 -> 0.000 over 90 steps
          #     [crowd] platform=Windows ... overlap 42.000 -> 0.000 over 90 steps
          #
          # Not merely a pass. **Identical numbers on both platforms**, all seven
          # cases, which is the determinism the rewrite existed to produce and a
          # far stronger result than "it went green once". The reporting-only
          # step is gone; this is the gate again.
          #
          # If it ever reddens main, the reporter above now names a crash as
          # SIGSEGV rather than "Exited 1", so the next failure will say what it
          # is instead of costing another bisect.
          check "crowd" --headless --path game res://tools/crowd_check.tscn
          #
          # night_check is absent for a different and better reason: it reads
          # pixels, and the runners are headless. Run headless it sampled the
          # dummy renderer, got null from every grab, measured nothing and
          # printed PASS - it refuses now instead. Run it on a machine with a
          # renderer, without --headless, when touching lighting or torches:
          #   godot --path game res://tools/night_check.tscn
          check "party reach" --headless --path game res://tools/party_reach_check.tscn
          check "projectile tiers" --headless --path game res://tools/projectile_tier_check.tscn
          # GDD §57 makes "no unreviewed enslavement language ships" a release
          # requirement. It was a thing somebody remembered to do until the
          # 2026-08-25 review found the seeder still writing v3's "Captive",
          # "Bind" and "is bound to the town and put to work" - one run from
          # putting it all back. A release requirement that depends on somebody
          # remembering is not a requirement, it is a hope.
          check "§57 copy" --headless --path game res://tools/copy_check.tscn
          # **The sound tables, and the call sites that name them.** This was on
          # the release bar only, so a caller naming a group that does not exist
          # - which plays nothing and warns about nothing - could sit on main
          # until a tag. Four of them did, including every drop landing on the
          # road and every pickup off it.
          check "audio tables" --headless --path game res://tools/audio_verify.tscn
          # The summons, and specifically the two properties that keep them a
          # spell rather than the party roster §54 cut: they expire, and there is
          # only ever one. Both would rot silently - a duration that stopped
          # being applied and a second cast that stacked would neither error nor
          # look wrong in a screenshot.
          check "companions" --headless --path game res://tools/companion_check.tscn
          # Traps: laid on roads, in Preparation, and consumed. All three are
          # rules nothing else would notice being broken - a trap that could be
          # dropped mid-combat reopens the locked build phase without erroring,
          # and one that stopped counting down would look entirely normal.
          check "traps" --headless --path game res://tools/trap_check.tscn
          # Co-op step 1: a host and a guest in one process, over a real
          # loopback socket. Two MultiplayerAPI instances can coexist because
          # one is registered per subtree, which is the only reason co-op can be
          # tested on a push at all rather than needing two machines.
          check "co-op transport" --headless --path game res://tools/coop_check.tscn
          # Co-op step 3: two heroes on one field. The hero reads its intentions
          # from a HeroInput rather than from Input directly, and if that ever
          # regresses to a per-call-site "is this hero mine" test, the partner's
          # hero twitches whenever the local player walks - obvious in co-op and
          # invisible to anyone testing alone.
          check "co-op heroes" --headless --path game res://tools/coop_heroes_check.tscn
          # Co-op step 4: mirrored enemies and host-judged building. A puppet
          # decides nothing - it does not walk, take damage or pay out - and a
          # build request is answered by the same try_build a local click uses
          # rather than by a copy of its rules, which would be a second answer.
          check "co-op world" --headless --path game res://tools/coop_world_check.tscn
          # Two WebRTC peers actually connecting and carrying packets, which is
          # the transport the web build and every unforwarded router depend on.
          #
          # It found two real bugs the day it was written. The transport waited
          # on `get_connection_status()`, which a mesh answers CONNECTED to
          # immediately because it is connected to itself - installing a peer
          # whose data channel was still closed. And the offer was coming from
          # the host, where `WebRTCMultiplayerPeer` puts the data channels on
          # the *higher* peer id and expects the offer to come from there.
          # `juice:` is the ICE library reporting a route it could not use -
          # on a runner, `Send failed, errno=101` is ENETUNREACH from an IPv6
          # candidate this machine has no path for. It is a dependency
          # describing the network it is in, the connection succeeds over the
          # routes that do work, and the harness exits 0. Nothing else in this
          # file is allowed to emit a warning of any kind.
          IGNORE_WARNINGS='juice:|rtc::impl' \
            check "webrtc" --headless --path game res://tools/webrtc_check.tscn

      - name: Say what broke
        if: failure()
        run: |
          echo "### main does not load" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA:0:8}\` by ${GITHUB_ACTOR}." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This guard only asks whether the projects load. It does not run" >> "$GITHUB_STEP_SUMMARY"
          echo "balance, soak or performance checks - those stay on the release" >> "$GITHUB_STEP_SUMMARY"
          echo "workflow. If this is red, something does not compile." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce locally:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'godot --headless --path game --quit' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  exports:
    name: Does it export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Loading and exporting are different questions, and the project has only
    # ever been asking the first one. The export ran for the first time when a
    # tag was already pushed and a version number was already spent — so an
    # export that could not work cost v0.4.2, then cost v0.4.3 proving it was
    # not a fluke, and neither run could say why without a signed-in session.
    #
    # Rehearsing it on an ordinary push moves that discovery to somewhere it
    # costs nothing. It runs beside "Does it load" rather than after it, so it
    # adds to the bill and not to the wait.

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import assets
        run: |
          timeout 300 godot --headless --path game --import || true
          timeout 300 godot --headless --path launcher --import || true

      - name: Register gameplay resource classes
        run: timeout 300 godot --headless --editor --path game --quit

      - name: Export the game
        run: bash .github/scripts/export_project.sh game game ../build/game/BeastRoad.exe "$EXPORT_PRESET"

      - name: Export the launcher
        run: bash .github/scripts/export_project.sh launcher launcher ../build/launcher/BeastRoadLauncher.exe "$EXPORT_PRESET"

      # Rehearsed here for the same reason the Windows export is: a web export
      # that cannot work should cost a push, not a version number.
      - name: Export the web build
        run: bash .github/scripts/export_project.sh web game ../build/web/index.html "$WEB_PRESET"

      - name: Check the exports are shippable
        # The same assertions the release makes, made here instead of there.
        # v0.1.0 shipped a launcher whose .pck was left beside it rather than
        # embedded, which fails on the player's machine and nowhere earlier.
        run: |
          set -euo pipefail
          test -s build/game/BeastRoad.exe
          test -s build/game/BeastRoad.pck
          test -s build/launcher/BeastRoadLauncher.exe

          # A web export writes a set of files beside the html, and the one that
          # actually matters is the wasm - index.html alone is what you get when
          # the template is missing pieces.
          for f in index.html index.js index.wasm index.pck; do
            if [ ! -s "build/web/$f" ]; then
              echo "::error title=Web build incomplete::build/web/$f is missing or empty."
              exit 1
            fi
          done

          # Caching rules travel with the build rather than living in a host's
          # dashboard, so a redeploy cannot lose them. Netlify reads `_headers`
          # from the root of whatever is deployed; other static hosts ignore the
          # file harmlessly.
          #
          # These filenames are reused on every release. Revalidate stored
          # files so an alternate host cannot serve an old wasm or pck beside
          # the updated shell. Keep this identical to the release bundle.
          {
            echo '/*'
            echo '  Cache-Control: no-cache'
          } > build/web/_headers
          test -s build/web/_headers

          # A threaded build only runs on a cross-origin-isolated page, and a
          # cross-origin-isolated document will not embed in an iframe that is
          # not — which is where this build is going. If this file appears,
          # variant/thread_support got turned back on and the page would load
          # and then fail to start.
          if [ -e build/web/index.worker.js ]; then
            echo "::error title=Web build is threaded::Set variant/thread_support=false in game/export_presets.cfg; Pages cannot send the cross-origin-isolation headers a threaded build needs."
            exit 1
          fi

          if [ -e build/launcher/BeastRoadLauncher.pck ]; then
            echo "::error title=Launcher not shippable::Exported with a separate .pck. Set binary_format/embed_pck=true in launcher/export_presets.cfg."
            exit 1
          fi

          ls -la build/game build/launcher build/web
