name: Android

# **Deliberately its own workflow, not a job inside Release.**
#
# The Android export is the one target that cannot be verified before it runs:
# it needs the Android SDK, a JDK and Godot's Android export templates, none of
# which exist on the machine this was written on. A wrong preset key or a missing
# template therefore shows up here for the first time - and if that lived inside
# the release pipeline, getting it wrong would stop the game shipping at all.
#
# Here it can go red on its own, attach nothing, and leave the Windows, web and
# launcher builds untouched. It also skips itself cleanly when the signing
# secrets are absent, so the repository keeps releasing normally until somebody
# adds them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1
  ANDROID_PRESET: Android

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checked before anything expensive, and reported as a notice rather than
      # a failure: an unsigned repository has not done anything wrong, it simply
      # has not been given a key yet. See docs/ANDROID.md.
      - name: Do we have a signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android::No ANDROID_KEYSTORE_BASE64 secret, so no APK was built. See docs/ANDROID.md."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.key.outputs.have == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        if: steps.key.outputs.have == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Godot and its Android export templates
        if: steps.key.outputs.have == 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # Godot finds the SDK through its editor settings, which do not exist on a
      # runner - so they are written here rather than assumed.
      - name: Point Godot at the SDK
        if: steps.key.outputs.have == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/debug_keystore = ""
          export/android/debug_keystore_user = ""
          export/android/debug_keystore_pass = ""
          EOF

      - name: Restore the signing key
        if: steps.key.outputs.have == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/keys"
          # Written outside the workspace so it cannot be picked up by an export
          # filter or committed by a later step.
          #
          # **All whitespace stripped before decoding.** The base64 is produced on
          # a desktop and pasted into a secret by a person, so it arrives with
          # whatever the editor left on it - Notepad appends a CRLF, and GNU
          # `base64 -d` rejects a carriage return as a non-alphabet character
          # rather than ignoring it. Stripping is free and turns a confusing
          # "invalid input" into a non-event.
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -d > "$HOME/keys/release.keystore"
          test -s "$HOME/keys/release.keystore"
          # A PKCS12 or JKS keystore starts with a known magic; anything else
          # means the secret is not a keystore at all - a truncated paste, or the
          # wrong file - and saying so here beats a Gradle error ten minutes on.
          magic=$(head -c 2 "$HOME/keys/release.keystore" | xxd -p)
          case "$magic" in
            3082|feed) echo "keystore looks well formed ($magic)" ;;
            *) echo "::error title=Android::ANDROID_KEYSTORE_BASE64 did not decode to a keystore (starts $magic). Re-copy the base64; see docs/ANDROID.md."; exit 1 ;;
          esac

      # **Checked before the export, and told apart.** Godot reports a bad alias
      # and a bad password with one message - "Release Username and/or Password
      # is invalid" - which leaves the owner guessing which of two secrets to
      # re-enter. keytool can distinguish them, and an alias is not a secret, so
      # the ones actually in the keystore can be named.
      # **Works out the credentials from the keystore instead of trusting
      # what it was told.**
      #
      # The `||` default only applies when a secret is *absent*, so a stale
      # ANDROID_KEY_PASSWORD left over from an earlier key silently overrode the
      # right one and the build failed on a key that was perfectly good. Asking
      # the owner to go and delete secrets is a worse answer than not depending
      # on them: the passwords are tried in turn and the alias is read out of the
      # keystore, so any leftover secret is simply outvoted by the file itself.
      - name: Work out the signing credentials
        id: creds
        if: steps.key.outputs.have == 'true'
        env:
          SECRET_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          ks="$HOME/keys/release.keystore"
          password=""
          for candidate in "${SECRET_PASSWORD:-}" "beastroad-dev" "android"; do
            [ -z "$candidate" ] && continue
            if keytool -list -keystore "$ks" -storepass "$candidate" > /tmp/ks.txt 2>&1; then
              password="$candidate"
              break
            fi
          done
          if [ -z "$password" ]; then
            echo "::error title=Android signing::No known password opens this keystore. Run tools/new_signing_key.ps1 and paste the ANDROID_KEYSTORE_BASE64 it puts on your clipboard - the secret currently holds a different key."
            exit 1
          fi

          # The alias is read from the keystore rather than taken on trust. A
          # keystore this project made holds exactly one key, so there is nothing
          # to choose between; a secret still wins if it names a real entry.
          aliases=$(grep -oE '^[^,]+, .*PrivateKeyEntry' /tmp/ks.txt | cut -d, -f1 | xargs)
          alias=""
          if [ -n "${SECRET_ALIAS:-}" ] && keytool -list -keystore "$ks" -storepass "$password" -alias "$SECRET_ALIAS" > /dev/null 2>&1; then
            alias="$SECRET_ALIAS"
          else
            alias=$(printf '%s' "$aliases" | awk '{print $1}')
          fi
          if [ -z "$alias" ]; then
            echo "::error title=Android signing::The keystore holds no private key entry."
            exit 1
          fi

          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "signing as '$alias'; keystore holds: $aliases"

      - name: Import assets
        if: steps.key.outputs.have == 'true'
        run: godot --headless --path game --import

      - name: Export the APK
        if: steps.key.outputs.have == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/keys/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ steps.creds.outputs.alias }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          set -uo pipefail
          mkdir -p build/android
          # **Output captured and echoed back as an annotation.** Job logs need a
          # token to read, and whoever is iterating on this export does not have
          # one - so the first real run reported "exit code 1" and nothing else,
          # which is a failure you cannot act on. The tail of Godot's own complaint
          # is what names a missing template or a wrong preset key.
          set +e
          godot --headless --path game --export-release "$ANDROID_PRESET" ../build/android/BeastRoad.apk 2>&1 | tee /tmp/export.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || [ ! -s build/android/BeastRoad.apk ]; then
            cat /tmp/export.log
            errors=$(grep -iE '^(script )?error|failed|cannot|missing' /tmp/export.log | tail -n 12 | tr '\n' '~')
            if [ -z "$errors" ]; then errors=$(tail -n 12 /tmp/export.log | tr "\n" "~"); fi
            detail=$(printf "%s" "$errors" | cut -c1-900)
            echo "::error title=Android export failed::${detail}"
            exit 1
          fi
          ls -la build/android

      - name: Attach the APK to the release
        if: steps.key.outputs.have == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # **Waits for the release to exist.** This workflow and Release run in
          # parallel off the same tag, and the APK finishes first - so the upload
          # went looking for a release that had not been created yet and failed
          # having successfully built the thing it was trying to attach.
          #
          # Waiting rather than creating it: whoever creates the release decides
          # its title and notes, and that is the Release workflow's job. Creating
          # a bare one here would race it into a worse outcome than a late APK.
          for attempt in $(seq 1 60); do
            if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error title=Android::Release ${GITHUB_REF_NAME} never appeared, so the APK could not be attached. It built fine - download it from this run's artifacts."
              exit 1
            fi
            sleep 10
          done
          gh release upload "${GITHUB_REF_NAME}" build/android/BeastRoad.apk --clobber
          echo "::notice title=Android::APK attached to ${GITHUB_REF_NAME}."

      # Kept regardless of whether the upload worked. An APK that built but could
      # not be attached is still a working build, and throwing it away because of
      # a race in the step after it would be the wrong way round.
      - name: Keep the APK as an artifact
        if: always() && steps.key.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BeastRoad-apk
          path: build/android/BeastRoad.apk
          if-no-files-found: ignore
